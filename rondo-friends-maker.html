/* Layout: phone = stage on top, parts below. Desktop = stage left (sticky), parts right. Colour lives on the friend only. */
:root{--bg:#FAFAFA;--s1:#FFFFFF;--s2:#F1F1F3;--ink:#0A0A0A;--ink2:#6B6B72;--line:#E4E4E7;--ring:#0A0A0A;--paper:#F1F1F3;--paper2:#E4E4E8;--f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0A;--s1:#161618;--s2:#222225;--ink:#FFFFFF;--ink2:#A1A1A8;--line:#2A2A2E;--ring:#FFFFFF;--paper:#EDEDF0;--paper2:#DDDDE2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0A0A;--s1:#161618;--s2:#222225;--ink:#FFFFFF;--ink2:#A1A1A8;--line:#2A2A2E;--ring:#FFFFFF;--paper:#EDEDF0;--paper2:#DDDDE2;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;height:56px;flex:0 0 auto}
.brand{font-weight:600;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;background:#FFD60A;display:block}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--s2)}.ib[disabled]{opacity:.3;pointer-events:none}
.ib svg,.pill svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{height:40px;padding:0 16px;border-radius:999px;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.pri{background:var(--ink);color:var(--bg)}
.pill.sec{border:1px solid var(--line)}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(210px,38%) minmax(0,1fr);gap:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.stage{min-width:0;min-height:0;position:relative;background:var(--paper);border-radius:28px;display:grid;place-items:center;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.stage .ground{position:absolute;left:50%;bottom:9%;width:30%;height:4.5%;transform:translateX(-50%);background:var(--paper2);border-radius:50%}
#fig{position:relative;height:80%;margin-top:-2%;aspect-ratio:144/156;display:grid;place-items:center}
#fig svg{width:100%;height:100%;overflow:visible;display:block}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--ink2);pointer-events:none}
.stage .tag{position:absolute;top:14px;left:16px;font-size:12px;color:#6B6B72;font-weight:500}
@keyframes pop{0%{transform:scale(.9,1.08) translateY(6px)}45%{transform:scale(1.06,.94)}100%{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pop #fig svg{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.idle #fig svg{animation:bob 3.6s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.panel{display:flex;flex-direction:column;min-height:0;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid transparent;color:var(--ink2);font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{border-color:var(--ring);color:var(--ink)}
.sw{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;padding:5px 4px;align-items:center}
.sw::-webkit-scrollbar{display:none}
.sw b{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;position:relative}
.sw b.on{outline:2px solid var(--ring);outline-offset:2px}
.sw label{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--ink2);display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;color:var(--ink2);font-size:16px}
.sw input[type=color]{position:absolute;inset:-6px;opacity:0;cursor:pointer;width:50px;height:50px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 24px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.opt{display:grid;gap:4px;justify-items:center;padding:8px 4px 7px;border-radius:18px;border:1.5px solid transparent;background:var(--paper);font-size:12px;color:#55555C;transition:transform .15s}
.opt:active{transform:scale(.95)}
.opt svg{width:60px;height:54px;overflow:hidden}
.opt.on{outline:2px solid var(--ring);outline-offset:1.5px;color:#0A0A0A;font-weight:500}
.opt .none{width:56px;height:52px;display:grid;place-items:center;color:#6B6B72;font-size:22px}
.h{font-size:12px;font-weight:500;color:var(--ink2);margin:14px 2px 8px;letter-spacing:.02em}
.h:first-child{margin-top:2px}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sl{display:grid;gap:14px;padding:4px 2px}
.sl div{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px}
.sl label{font-size:14px;font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;width:100%;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);margin-top:-9px;border:3px solid var(--bg)}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:4px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
.reset{margin-top:10px}
/* card view + sheets */
.cv,.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.cvin{width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.cvbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;align-content:start;gap:16px;overflow-y:auto;padding-bottom:20px}
.pvwrap{display:grid;place-items:center;background:var(--s2);border-radius:24px;padding:16px}
.pvwrap img{max-width:100%;max-height:52vh;border-radius:6px;display:block;-webkit-touch-callout:default;user-select:auto}
.ctl{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:6px;flex-wrap:wrap}
.fld{display:grid;gap:6px}
.fld span{font-size:12px;font-weight:500;color:var(--ink2)}
.fld input[type=text]{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--s1);padding:0 14px;outline:none;width:100%}
.fld input[type=text]:focus{border-color:var(--ring)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .pill{height:46px;padding:0 22px}
.big{font-size:17px;font-weight:600;letter-spacing:-.01em}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;overflow-y:auto;padding:2px 2px 20px}
.mc{position:relative;border:1.5px solid transparent;background:var(--paper);border-radius:20px;padding:10px 6px 8px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.mc svg{width:84px;height:90px;overflow:visible}
.mc b{color:#0A0A0A;font-weight:500;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc{color:#55555C}.mc .x{color:#55555C;position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;color:var(--ink2);display:grid;place-items:center}
.mc .x:hover{background:var(--s2)}
.empty{color:var(--ink2);padding:40px 12px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;transition:.3s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){
 .cvbody{grid-auto-rows:auto;align-content:stretch}
 .work{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px}
 .stage{border-radius:32px}
 .cvbody{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;overflow:hidden}
 .pvwrap{min-height:0;height:100%}.pvwrap img{max-height:100%}
 .ctl{overflow-y:auto;padding-bottom:20px}
}
@media (prefers-reduced-motion:reduce){.idle #fig svg,.pop #fig svg,.eye{animation:none}.cv,.sheet{animation:none}}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
[hidden]{display:none!important}

.sact{position:absolute;top:8px;right:8px;display:flex;gap:2px;background:#fff;border-radius:999px;padding:2px;color:#0A0A0A}.sact .ib{color:#0A0A0A}.sact .ib:hover{background:#EDEDF0}
.stage .tag{top:16px}
</style>
<div id="app">
 <header class="top"><div class="brand"><i></i>Rondo Friends</div>
  <button class="pill sec" id="mine">Friends</button><button class="pill pri" id="make">Card</button></header>
 <main class="work">
  <section class="stage" id="stage" aria-label="Your friend. Tap to change mood."><div class="ground"></div><div id="fig"></div><div class="tag">Tap me</div><div class="sact"><button class="ib" id="undo" aria-label="Undo"></button><button class="ib" id="redo" aria-label="Redo"></button><button class="ib" id="dice" aria-label="Surprise me"></button></div></section>
  <section class="panel"><nav class="tabs" id="tabs"></nav><div class="scroll" id="scroll"><div id="opts"></div></div></section>
 </main>
 <div class="cv" id="cardview" hidden></div><div class="sheet" id="sheet" hidden></div><div class="toast" id="toast" role="status"></div>
</div>

<script>
/* ===== Rondo Friends kit: bodies, geometry, palettes ===== */
const I='#0A0A0A';
const _rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const _mix=(a,b,t)=>{if(!/^#[0-9a-f]{6}$/i.test(a))return a;const x=_rgb(a),y=_rgb(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const shade=(c,t=.14)=>_mix(c,'#000000',t),tint=(c,t=.45)=>_mix(c,'#ffffff',t);
const HL=(d)=>`<path d="${d}" stroke="#fff" stroke-opacity=".42" stroke-width="5" stroke-linecap="round" fill="none"/>`;
const PINK='#FF9DBB';
const COLORS=['#FFD60A','#B7F34D','#C8B6FF','#FF8F70','#8ED6FF','#FFB4D2','#7EE8C0','#FFB347','#FF5C5C','#5B8DEF','#F4F1EC','#3A3A40'];
const ITEMC=['#FF6B4A','#FFD60A','#3DDC84','#8ED6FF','#FF4D8D','#C8B6FF','#FFFFFF','#0A0A0A'];
const HAIRC=['#0A0A0A','#4A3228','#8B5A2B','#F2C94C','#FF6B8B','#8ED6FF','#C8B6FF','#FFFFFF'];
const SHAPES=['dot','bean','mochi','puff','gem','nib','bun','blob','sunny','drop','star','ghost'];
const SP_NAME={dot:'Dot',bean:'Bean',mochi:'Mochi',puff:'Puff',gem:'Gem',nib:'Nib',bun:'Bun',blob:'Blob',sunny:'Sunny',drop:'Drop',star:'Star',ghost:'Wisp'};
const SP={
  dot:{ey:50,ed:17,top:7,b:(c)=>`<circle cx="50" cy="52" r="45" fill="${c}"/>${HL('M20 42Q24 26 40 17')}`},
  bean:{ey:42,ed:14,top:8,b:(c,d,l)=>`<rect x="19" y="8" width="62" height="88" rx="31" fill="${c}"/><ellipse cx="50" cy="79" rx="21" ry="13" fill="${l}" opacity=".55"/>${HL('M30 30Q31 20 39 14')}`},
  mochi:{ey:55,ed:19,top:14,b:(c,d)=>`<circle cx="24" cy="20" r="14" fill="${c}"/><circle cx="76" cy="20" r="14" fill="${c}"/><ellipse cx="24" cy="21" rx="6" ry="7" fill="${PINK}" opacity=".7"/><ellipse cx="76" cy="21" rx="6" ry="7" fill="${PINK}" opacity=".7"/><rect x="6" y="16" width="88" height="79" rx="33" fill="${c}"/>${HL('M18 48Q19 33 31 27')}`},
  puff:{ey:50,ed:17,top:3,b:(c)=>{let o='';for(let k=0;k<8;k++){const a=k*Math.PI/4;o+=`<circle cx="${(50+28*Math.cos(a)).toFixed(1)}" cy="${(50+28*Math.sin(a)).toFixed(1)}" r="20" fill="${c}"/>`}return o+`<circle cx="50" cy="50" r="32" fill="${c}"/>${HL('M24 40Q27 28 38 22')}`}},
  gem:{ey:49,ed:16,top:3,b:(c,d,l)=>`<rect x="16" y="16" width="68" height="68" rx="22" transform="rotate(45 50 50)" fill="${c}"/><path d="M50 17 69 36H31Z" fill="${l}" opacity=".3"/>${HL('M24 40Q30 28 42 20')}`},
  nib:{ey:62,ed:16,top:8,b:(c,d,l)=>`<path d="M50 8c6 0 10 3 13 9l27 50c5 9-1 19-12 19H22C11 86 5 76 10 67l27-50c3-6 7-9 13-9z" fill="${c}"/>${HL('M36 30Q40 22 46 18')}`},
  bun:{ey:63,ed:15,top:30,b:(c)=>`<g transform="rotate(-9 32 40)"><rect x="23" y="-2" width="18" height="48" rx="9" fill="${c}"/><rect x="28" y="6" width="8" height="30" rx="4" fill="${PINK}" opacity=".7"/></g><g transform="rotate(9 68 40)"><rect x="59" y="-2" width="18" height="48" rx="9" fill="${c}"/><rect x="64" y="6" width="8" height="30" rx="4" fill="${PINK}" opacity=".7"/></g><circle cx="50" cy="65" r="34" fill="${c}"/>${HL('M24 58Q27 46 38 40')}`},
  blob:{ey:48,ed:16,top:5,b:(c,d)=>`<path d="M50 6C73 3 95 19 92 46 99 71 78 95 50 94 22 97 3 73 9 46 5 22 28 9 50 6z" fill="${c}"/><circle cx="21" cy="72" r="6" fill="${d}" opacity=".5"/><circle cx="79" cy="75" r="4.500" fill="${d}" opacity=".5"/><circle cx="80" cy="24" r="4" fill="${d}" opacity=".5"/>${HL('M20 38Q24 24 38 16')}`},
  sunny:{ey:50,ed:16,top:4,b:(c)=>{let o='';for(let k=0;k<12;k++){const a=k*Math.PI/6;o+=`<circle cx="${(50+36*Math.cos(a)).toFixed(1)}" cy="${(50+36*Math.sin(a)).toFixed(1)}" r="11" fill="${c}"/>`}return o+`<circle cx="50" cy="50" r="38" fill="${c}"/>${HL('M24 40Q27 28 38 22')}`}},
  drop:{ey:64,ed:14,top:4,b:(c,d,l)=>`<path d="M50 4C58 24 88 44 88 65 88 85 71 96 50 96 29 96 12 85 12 65 12 44 42 24 50 4z" fill="${c}"/>${HL('M26 66Q24 56 30 48')}`},
  star:{ey:56,ed:15,top:8,b:(c)=>{const P=[];for(let k=0;k<10;k++){const r=k%2?24:40,a=-Math.PI/2+k*Math.PI/5;P.push((50+r*Math.cos(a)).toFixed(1)+' '+(55+r*Math.sin(a)).toFixed(1))}return `<polygon points="${P.join(' ')}" fill="${c}" stroke="${c}" stroke-width="14" stroke-linejoin="round"/>`}},
  ghost:{ey:44,ed:16,top:6,b:(c)=>`<path d="M14 92V46C14 24 30 8 50 8s36 16 36 38v46L72 82 61 92 50 82 39 92 28 82z" fill="${c}" stroke="${c}" stroke-width="6" stroke-linejoin="round"/>${HL('M26 38Q28 24 40 17')}`},
  shield:{ey:44,ed:16,top:4,b:(c)=>`<path d="M50 4 90 19v31c0 25-17 41-40 48C27 91 10 75 10 50V19z" fill="${c}" stroke="${c}" stroke-width="6" stroke-linejoin="round"/>`}
};
/* extra geometry per species: ear point (left), neck line y, clip override, brow room */
const GEO={
 dot:{ear:[6,58],ny:80},bean:{ear:[19,52],ny:70},mochi:{ear:[8,64],ny:82},puff:{ear:[5,58],ny:80},
 gem:{ear:[5,50],ny:76},nib:{ear:[14,64],ny:74},bun:{ear:[16,70],ny:88,clip:'<circle cx="50" cy="65" r="34"/>'},
 blob:{ear:[9,58],ny:80},sunny:{ear:[5,56],ny:82},drop:{ear:[14,68],ny:84},
 star:{ear:[10,62],ny:72,clip:'<circle cx="50" cy="55" r="40"/>'},ghost:{ear:[13,52],ny:74}
};
for(const k in GEO)Object.assign(SP[k],GEO[k]);
const spOf=s=>SP[s]||SP.dot;
function bodySVG(s,c){return spOf(s).b(c,shade(c,.14),tint(c,.5))}

/* ===== Face parts. Eyes are drawn at 0,0; mouths at 0,0. ===== */
const S=(w=4)=>`stroke="${I}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
const ovalEye=(o={})=>{const rx=o.rx||4.6,ry=o.ry||6.4,lk=o.look||0,dy=o.dy||0;return `<g class="eye"><ellipse cx="${lk}" cy="${dy}" rx="${rx}" ry="${ry}" fill="${I}"/><circle cx="${lk+1.9}" cy="${dy-2.4}" r="2" fill="#fff"/><circle cx="${lk-1.5}" cy="${dy+2.6}" r=".9" fill="#fff" opacity=".8"/></g>`};
const upEye=`<path d="M-6.5 3 Q0 -6.5 6.5 3" ${S(4)}/>`;
const downEye=`<path d="M-6 -1 Q0 7 6 -1" ${S(4)}/>`;
const heartE=`<path d="M0 8 C-13 -1 -8 -11 0 -4 C8 -11 13 -1 0 8z" fill="#FF3B6B" stroke="${I}" stroke-width="2.5" stroke-linejoin="round"/>`;
const starPts=(r1,r2)=>{const P=[];for(let k=0;k<10;k++){const r=k%2?r2:r1,a=-Math.PI/2+k*Math.PI/5;P.push((r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1))}return P.join(' ')};
const starE=`<polygon points="${starPts(7.6,3.4)}" fill="#FFD60A" stroke="${I}" stroke-width="2.6" stroke-linejoin="round"/>`;
const EYES={
 oval:{n:'Round',f:()=>ovalEye()},
 dot:{n:'Dots',f:()=>`<g class="eye"><circle r="3.6" fill="${I}"/></g>`},
 wide:{n:'Wide',f:()=>ovalEye({rx:5.2,ry:7.6})},
 shine:{n:'Sparkly',f:s=>`<g class="eye"><ellipse rx="5.6" ry="7.2" fill="${I}"/><ellipse cx="1.6" cy="-2.6" rx="2.6" ry="2.8" fill="#fff"/><circle cx="-2" cy="3" r="1.3" fill="#fff"/><circle cx="2.6" cy="2.4" r=".8" fill="#fff" opacity=".7"/></g>`},
 up:{n:'Happy',f:()=>upEye},
 down:{n:'Calm',f:()=>downEye},
 wink:{n:'Wink',f:s=>s<0?ovalEye():upEye},
 heart:{n:'Hearts',f:()=>heartE},
 star:{n:'Stars',f:()=>starE},
 lash:{n:'Lashes',f:s=>`${ovalEye()}<path d="M${s*4.8} -3 L${s*9} -6.500 M${s*5.4} 0 L${s*10} -1.800 M${s*4.4} -5.400 L${s*7} -9.500" ${S(2.6)}/>`},
 glance:{n:'Glance',f:()=>ovalEye({look:2.4})},
 shy:{n:'Peek',f:()=>ovalEye({look:-2,dy:1.5})},
 lid:{n:'Half lid',f:()=>`<path d="M-5.600 0 A5.600 5.600 0 0 0 5.600 0Z" fill="${I}"/><path d="M-7 0 H7" ${S(3.2)}/>`},
 dizzy:{n:'Dizzy',f:()=>`<path d="M0 0 Q3 -1 2.500 -3.500 Q-1 -6 -4.500 -2.500 Q-6.500 2.500 -2 5.500 Q4.500 7.500 7.500 2" ${S(2.4)}/>`},
 cross:{n:'Out cold',f:()=>`<path d="M-4.500 -4.500 L4.500 4.500 M4.500 -4.500 L-4.500 4.500" ${S(3.6)}/>`},
 sparkle:{n:'Twinkle',f:()=>`<path d="M0-8 2.200-2.200 8 0 2.200 2.200 0 8-2.200 2.200-8 0-2.200-2.200Z" fill="#FFD60A" stroke="${I}" stroke-width="2.2" stroke-linejoin="round"/>`},
 tear:{n:'Teary',f:()=>`${ovalEye({dy:-1})}<path d="M0 6 Q4.500 12 0 15 Q-4.500 12 0 6z" fill="#8ED6FF" stroke="${I}" stroke-width="2" stroke-linejoin="round"/>`},
 shades:{n:'Shades',f:(s,c)=>`<rect x="-12.500" y="-7" width="25" height="17" rx="7" fill="${I}"/><path d="M-8 -2 l4 -3" stroke="#fff" stroke-opacity=".55" stroke-width="2.500" stroke-linecap="round"/>${s<0?`<path d="M12.500 -1H${2*c.ed-12.5}" ${S(3)}/><path d="M-12.500 -2L-19 -6" ${S(3)}/>`:`<path d="M12.500 -2L19 -6" ${S(3)}/>`}`}
};
const SM=`M-9 -1 Q0 9 9 -1`;
const tongueD=`<path d="M-6 9 Q0 4 6 9 Q0 16 -6 9z" fill="#FF6B8B"/>`;
const MOUTHS={
 smile:{n:'Smile',f:()=>`<path d="${SM}" ${S(4)}/>`},
 open:{n:'Open',f:()=>`<path d="M-12 -3 Q0 22 12 -3z" fill="${I}" stroke="${I}" stroke-width="3" stroke-linejoin="round"/><path d="M-6 9 Q0 4 6 9 Q0 16 -6 9z" fill="#FF6B8B"/>`},
 grin:{n:'Grin',f:()=>`<path d="M-13 -3 H13 Q13 13 0 13 Q-13 13 -13 -3z" fill="#fff" stroke="${I}" stroke-width="3.200" stroke-linejoin="round"/><path d="M-13 5H13M0 -3V13" stroke="${I}" stroke-width="2"/>`},
 tiny:{n:'Tiny',f:()=>`<path d="M-6 0 Q0 5 6 0" ${S(4)}/>`},
 flat:{n:'Flat',f:()=>`<path d="M-7 2 H7" ${S(4)}/>`},
 smirk:{n:'Smirk',f:()=>`<path d="M-8 3 Q4 11 12 -2" ${S(4)}/>`},
 o:{n:'Ooh',f:()=>`<ellipse cx="0" cy="4" rx="5.500" ry="7.500" fill="${I}"/>`},
 tongue:{n:'Tongue',f:()=>`<path d="${SM}" ${S(4)}/><path d="M-2 5 v7 a5 5 0 0 0 10 0 v-5" fill="#FF6B8B" stroke="${I}" stroke-width="3" stroke-linejoin="round"/>`},
 kiss:{n:'Kiss',f:()=>`<path d="M-3 -3 Q3 -6 6 1 Q3 6 -3 5 Q1 1 -3 -3z" fill="#FF6B8B" stroke="${I}" stroke-width="2.600" stroke-linejoin="round"/>`},
 wavy:{n:'Wobbly',f:()=>`<path d="M-9 3 q4.500 -5 9 0 q4.500 5 9 0" ${S(3.2)}/>`},
 frown:{n:'Frown',f:()=>`<path d="M-9 8 Q0 -1 9 8" ${S(4)}/>`},
 cat:{n:'Cat',f:()=>`<path d="M-10 0 Q-5 7 0 1 Q5 7 10 0" ${S(3.6)}/>`},
 laugh:{n:'Laugh',f:()=>`<path d="M-13 -3 H13 Q12 16 0 16 Q-12 16 -13 -3z" fill="${I}" stroke="${I}" stroke-width="3" stroke-linejoin="round"/><path d="M-13 -3 H13 V0 H-13z" fill="#fff"/><ellipse cx="0" cy="12.500" rx="6.500" ry="3.800" fill="#FF6B8B"/>`},
 fang:{n:'Fangs',f:()=>`<path d="${SM}" ${S(4)}/><path d="M-6.500 2.500 l2.500 6 l2.500 -4 M3.500 4.500 l2.500 4 l2 -6" fill="#fff" stroke="${I}" stroke-width="2.200" stroke-linejoin="round"/>`},
 buck:{n:'Buck teeth',f:()=>`<path d="${SM}" ${S(4)}/><path d="M-5 3.500 v8 h5 v-6.500 M0 5 v6.500 h5 v-8" fill="#fff" stroke="${I}" stroke-width="2.400" stroke-linejoin="round"/>`},
 yum:{n:'Yum',f:()=>`<path d="${SM}" ${S(4)}/><path d="M4 3 q9 1 7 8 q-3 5 -8 0z" fill="#FF6B8B" stroke="${I}" stroke-width="2.800" stroke-linejoin="round"/>`}
};
const brw=(x1,y1,cx,cy,x2,y2)=>`M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`;
const BROWS={
 none:{n:'None',f:()=>''},
 soft:{n:'Soft',f:s=>`<path d="M-6 -14 Q0 -18 6 -14" ${S(3)}/>`},
 raised:{n:'Raised',f:s=>`<path d="M-6 -17 Q0 -22 6 -17" ${S(3)}/>`},
 angry:{n:'Angry',f:s=>`<path d="M${s*7} -17 L${-s*6} -12" ${S(3.600)}/>`},
 worried:{n:'Worried',f:s=>`<path d="M${s*7} -12 L${-s*6} -17" ${S(3.200)}/>`},
 one:{n:'One up',f:s=>s>0?`<path d="M-6 -16 Q0 -22 7 -17" ${S(3.200)}/>`:`<path d="M-6 -13 H6" ${S(3.200)}/>`},
 bold:{n:'Bold',f:s=>`<path d="M-6.500 -14 H6.500" ${S(5.500)}/>`}
};

}
/* ===== cards ===== */
const FMT=[['card','Card'],['polaroid','Polaroid'],['avatar','Avatar'],['sticker','Sticker']];
const CV={fmt:'card',theme:'light',bg:'auto',serial:Math.floor(Math.random()*9000)+1000};
const BGS=['auto','#FFFFFF','#F4F1EC','#0A0A0A',...COLORS.slice(0,8)];
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
async function charCanvas(w){const h=Math.round(w*156/144);const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${VB}" width="${w}" height="${h}">${figure(M)}</svg>`;const i=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);return c}
const fontOK=()=>Promise.all(['500 40px','600 40px','400 40px'].map(f=>document.fonts.load(f+' "Bricolage Grotesque"'))).catch(()=>{});
const tx=(c,s,x,y,font,col,al='left')=>{c.font=font;c.fillStyle=col;c.textAlign=al;c.textBaseline='alphabetic';c.fillText(s,x,y)};
function fit(c,s,font,maxw){let px=+font.match(/(\d+)px/)[1];while(px>28){c.font=font.replace(/\d+px/,px+'px');if(c.measureText(s).width<=maxw)break;px-=2}return font.replace(/\d+px/,px+'px')}
async function makeCanvas(fmt){
  await fontOK();
  const nm=PROFILE.name.trim()||'Your Name',hd=(PROFILE.handle.trim().replace(/^@*/,'')||'yourname'),ln=PROFILE.line.trim();
  const dark=CV.theme==='dark',bgc=CV.bg==='auto'?null:CV.bg;
  const panel=bgc||tint(M.color,.55);
  const ink='#0A0A0A';
  const cv=document.createElement('canvas'),c=cv.getContext('2d');
  if(fmt==='card'){
    cv.width=1080;cv.height=1350;
    c.fillStyle=dark?'#0A0A0A':'#FAFAFA';c.fillRect(0,0,1080,1350);
    rr(c,100,115,880,1120,84);c.fillStyle=dark?'#161618':'#FFFFFF';c.fill();
    rr(c,130,145,820,830,58);c.fillStyle=panel;c.fill();
    const pdark=/^#0a0a0a$/i.test(panel),pc=pdark?'#fff':ink;
    tx(c,nm,540,250,fit(c,nm,'600 76px "Bricolage Grotesque"',740),pc,'center');
    tx(c,ln||'Rondo Friend',540,310,'400 32px "Bricolage Grotesque"',pdark?'rgba(255,255,255,.65)':'rgba(10,10,10,.6)','center');
    c.fillStyle=shade(panel,.08);c.beginPath();c.ellipse(540,915,210,24,0,0,7);c.fill();
    const ch=await charCanvas(620);c.drawImage(ch,230,305,620,Math.round(620*156/144));
    // footer
    const av=await charCanvas(150);c.save();c.beginPath();c.arc(214,1103,50,0,7);c.clip();c.fillStyle=panel;c.fillRect(160,1050,110,110);c.drawImage(av,214-60,1103-57,120,130);c.restore();
    const ic=dark?'#fff':ink,ic2=dark?'#A1A1A8':'#6B6B72';
    tx(c,'@'+hd,288,1100,fit(c,'@'+hd,'500 38px "Bricolage Grotesque"',340),ic);
    tx(c,'Rondo Friend · No. '+CV.serial,288,1144,'400 28px "Bricolage Grotesque"',ic2);
    rr(c,672,1062,278,82,41);c.fillStyle=dark?'#fff':ink;c.fill();
    c.strokeStyle=dark?ink:'#fff';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(706,1103);c.lineTo(730,1103);c.moveTo(718,1091);c.lineTo(718,1115);c.stroke();
    tx(c,'Add friend',748,1114,'500 32px "Bricolage Grotesque"',dark?ink:'#fff');
  }else if(fmt==='polaroid'){
    cv.width=1080;cv.height=1350;
    const outer=bgc&&CV.bg!=='auto'?null:null;
    c.fillStyle=dark?'#0A0A0A':'#FAFAFA';c.fillRect(0,0,1080,1350);
    c.save();c.translate(540,690);c.rotate(-.045);
    c.fillStyle='rgba(0,0,0,.10)';rr(c,-400+14,-500+20,800,1000,18);c.fill();
    rr(c,-400,-500,800,1000,18);c.fillStyle='#FFFFFF';c.fill();c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.08)';c.stroke();
    rr(c,-360,-460,720,720,6);c.fillStyle=panel;c.fill();
    c.fillStyle=shade(panel,.08);c.beginPath();c.ellipse(0,190,170,20,0,0,7);c.fill();
    const ch=await charCanvas(640);c.drawImage(ch,-320,-455,640,Math.round(640*156/144));
    tx(c,nm,-360,368,fit(c,nm,'600 64px "Bricolage Grotesque"',560),ink);
    tx(c,'@'+hd,-360,420,'400 34px "Bricolage Grotesque"','#6B6B72');
    tx(c,'No. '+CV.serial,360,420,'500 30px "Bricolage Grotesque"','#6B6B72','right');
    tx(c,ln||new Date().toLocaleDateString('en',{month:'short',year:'numeric'}),360,368,'400 30px "Bricolage Grotesque"','#6B6B72','right');
    c.save();c.rotate(.06);c.fillStyle='rgba(255,214,10,.92)';c.fillRect(-90,-520,180,58);c.restore();
    c.restore();
  }else if(fmt==='avatar'){
    cv.width=1024;cv.height=1024;c.fillStyle=panel;c.fillRect(0,0,1024,1024);
    c.fillStyle=shade(panel,.07);c.beginPath();c.ellipse(512,840,230,26,0,0,7);c.fill();
    const ch=await charCanvas(780);c.drawImage(ch,122,86,780,Math.round(780*156/144));
  }else{
    cv.width=1024;cv.height=1024;
    const ch=await charCanvas(700),w=ch.width,h=ch.height;
    const pad=60,A=document.createElement('canvas');A.width=1024;A.height=1024;const a=A.getContext('2d');a.drawImage(ch,(1024-w)/2,(1024-h)/2+10);
    const B=document.createElement('canvas');B.width=1024;B.height=1024;const b=B.getContext('2d');b.drawImage(A,0,0);b.globalCompositeOperation='source-in';b.fillStyle='#fff';b.fillRect(0,0,1024,1024);
    const G=document.createElement('canvas');G.width=1024;G.height=1024;const g=G.getContext('2d');g.drawImage(B,0,0);g.globalCompositeOperation='source-in';g.fillStyle='rgba(10,10,10,.16)';g.fillRect(0,0,1024,1024);
    for(let k=0;k<48;k++){const an=k/48*Math.PI*2;c.drawImage(G,Math.cos(an)*34,Math.sin(an)*34+4)}
    for(let k=0;k<48;k++){const an=k/48*Math.PI*2;c.drawImage(B,Math.cos(an)*28,Math.sin(an)*28)}
    c.drawImage(A,0,0);
  }
  return cv;
}
let pvTok=0;
async function renderPreview(){
  const tok=++pvTok;const cv=await makeCanvas(CV.fmt);if(tok!==pvTok)return;
  $('#pv').src=cv.toDataURL('image/png');
  const wrap=$('.pvwrap');wrap.style.background=CV.fmt==='sticker'?'repeating-conic-gradient(var(--s2) 0 25%, var(--bg) 0 50%) 0 0/24px 24px':'';
}
function fileName(){const base=(PROFILE.handle||PROFILE.name||'friend').replace(/[^a-z0-9_-]+/gi,'').toLowerCase()||'friend';return `rondo-friend-${base}-${CV.fmt}.png`}
function openCard(){
  const v=$('#cardview');v.hidden=false;
  const fields=CV.fmt==='avatar'||CV.fmt==='sticker'?'':`<label class="fld"><span>Name</span><input type="text" id="f_name" maxlength="24" value="${esc(PROFILE.name)}" placeholder="Your name" autocomplete="off"></label><label class="fld"><span>Handle</span><input type="text" id="f_handle" maxlength="20" value="${esc(PROFILE.handle)}" placeholder="@yourname" autocomplete="off" autocapitalize="off"></label>${CV.fmt==='card'?`<label class="fld"><span>Status</span><input type="text" id="f_line" maxlength="30" value="${esc(PROFILE.line)}" placeholder="Making friends" autocomplete="off"></label>`:''}`;
  v.innerHTML=`<div class="cvin"><div class="top"><button class="ib" id="cvback" aria-label="Back">${ico('back')}</button><div class="brand">Make a card</div></div><div class="cvbody"><div class="pvwrap"><img id="pv" alt="Preview of your card"></div><div class="ctl"><div class="row" id="fmts">${FMT.map(([k,n])=>`<button class="tab ${CV.fmt===k?'on':''}" data-f="${k}">${n}</button>`).join('')}</div>${fields}<div class="fld"><span>${CV.fmt==='sticker'?'Background':'Background'}</span>${CV.fmt==='sticker'?'<div class="cap" style="color:var(--ink2);font-size:13px">Stickers are saved with a clear background.</div>':`<div class="sw" id="bgs">${BGS.map(c=>c==='auto'?`<b data-bg="auto" class="${CV.bg==='auto'?'on':''}" style="background:${tint(M.color,.55)}" title="Match my friend"></b>`:`<b data-bg="${c}" class="${CV.bg===c?'on':''}" style="background:${c}"></b>`).join('')}</div>`}</div>${CV.fmt==='card'?`<div class="fld"><span>Frame</span><div class="row"><button class="tab ${CV.theme==='light'?'on':''}" data-th="light">Light</button><button class="tab ${CV.theme==='dark'?'on':''}" data-th="dark">Dark</button></div></div>`:''}<div class="acts"><button class="pill pri" id="dl">Save image</button><button class="pill sec" id="keep">Keep</button><button class="pill sec" id="copy">Copy code</button></div></div></div></div>`;
  renderPreview();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pvT;const later=()=>{clearTimeout(pvT);pvT=setTimeout(renderPreview,160)};
document.addEventListener('click',async e=>{
  const t=e.target.closest('#cvback,[data-f],[data-bg],[data-th],#dl,#keep,#copy,#mine,#make,#shback,[data-load],[data-del],#imp');if(!t)return;
  if(t.id==='make'){openCard();return}
  if(t.id==='cvback'){$('#cardview').hidden=true;return}
  if(t.dataset.f){CV.fmt=t.dataset.f;openCard();return}
  if(t.dataset.bg){CV.bg=t.dataset.bg;$$('#bgs b').forEach(b=>b.classList.toggle('on',b.dataset.bg===CV.bg));renderPreview();return}
  if(t.dataset.th){CV.theme=t.dataset.th;$$('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===CV.theme));renderPreview();return}
  if(t.id==='dl'){const cv=await makeCanvas(CV.fmt);cv.toBlob(b=>saveBlob(b,fileName()),'image/png');return}
  if(t.id==='keep'){keep();return}
  if(t.id==='copy'){const code='RF-'+encode(M);try{await navigator.clipboard.writeText(code);toast('Code copied')}catch(err){prompt_(code)}return}
  if(t.id==='mine'){openMine();return}
  if(t.id==='shback'){$('#sheet').hidden=true;return}
  if(t.dataset.load){const s=SAVED.find(x=>x.id===t.dataset.load);if(s){M=Object.assign(defaults(),s.m);M.t=Object.assign({},T0,M.t);Object.assign(PROFILE,{name:s.name||'',handle:s.handle||'',line:s.line||PROFILE.line});$('#sheet').hidden=true;commit()}return}
  if(t.dataset.del){SAVED=SAVED.filter(x=>x.id!==t.dataset.del);ST.set('rf.saved',SAVED);openMine();return}
  if(t.id==='imp'){const v=$('#impin').value,m=decode(v);if(!m){toast('That code does not look right');return}M=m;$('#sheet').hidden=true;commit();toast('Friend loaded')}
});
function prompt_(code){toast('Select and copy: '+code.slice(0,18)+'…')}
document.addEventListener('input',e=>{
  const t=e.target;if(!t.id||!t.id.startsWith('f_'))return;
  if(t.id==='f_name')PROFILE.name=t.value;if(t.id==='f_handle'){PROFILE.handle=t.value.replace(/\s/g,'')}if(t.id==='f_line')PROFILE.line=t.value;
  ST.set('rf.profile',PROFILE);later();
});
function keep(){
  const id='f'+Date.now().toString(36);
  SAVED.unshift({id,m:JSON.parse(JSON.stringify(M)),name:PROFILE.name,handle:PROFILE.handle,line:PROFILE.line,ts:Date.now()});SAVED=SAVED.slice(0,60);ST.set('rf.saved',SAVED);toast('Kept in Friends');
}
function openMine(){
  const s=$('#sheet');s.hidden=false;
  s.innerHTML=`<div class="cvin"><div class="top"><button class="ib" id="shback" aria-label="Back">${ico('back')}</button><div class="brand">Friends</div><button class="pill sec" id="keep2" onclick="keep();openMine()">Keep this one</button></div>${SAVED.length?`<div class="mine">${SAVED.map(x=>`<div class="mc"><button class="x" data-del="${x.id}" aria-label="Delete">${ico('x')}</button><button data-load="${x.id}" style="display:grid;justify-items:center;gap:4px;width:100%">${svgOf(Object.assign(defaults(),x.m),84)}<b>${esc(x.name||'Friend')}</b></button></div>`).join('')}</div>`:`<div class="empty">Nobody here yet. Make a friend, then tap Keep.</div>`}<div class="fld" style="margin:8px 0 20px"><span>Have a code?</span><div class="row" style="flex-wrap:nowrap"><input type="text" id="impin" placeholder="RF-…" style="flex:1;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--s1);padding:0 14px;min-width:0"><button class="pill pri" id="imp" style="height:46px">Load</button></div></div></div>`;
}
/* boot */
function boot(){
  const cur=ST.get('rf.cur',null);
  M=cur?Object.assign(defaults(),cur):starter(0);M.t=Object.assign({},T0,M.t||{});
  if(!SP[M.sp])M.sp='dot';
  $('#dice').innerHTML=ico('dice');$('#undo').innerHTML=ico('undo');$('#redo').innerHTML=ico('redo');
  HIST=[snap()];HI=0;draw(true);
  setTimeout(()=>$('#stage').classList.add('idle'),700);
}
boot();

</script>
</body></html>
