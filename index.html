:root{
  --ff:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --t-title:17px;--t-sec:15px;--t-body:14.5px;--t-meta:12px;--t-hero:34px;
  --y:#FFD60A;--lime:#B7F34D;--lilac:#C8B6FF;--coral:#FF8F70;--sky:#8ED6FF;--pink:#FFB4D2;--mint:#7EE8C0;--amber:#FFB347;
  --ok:#2FBF71;--bad:#FF4D3D;
  --spring:cubic-bezier(.2,.9,.25,1.15);--ease:cubic-bezier(.2,.8,.2,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
:root,:root[data-theme="light"]{
  --bg:#FAFAFA;--s1:#FFFFFF;--s2:#F3F3F3;--s3:#E9E9E9;--line:#E8E8E8;--line2:#D6D6D6;
  --ink:#0A0A0A;--ink2:#707070;--ink3:#A6A6A6;--stage:#E4E4E4;--scrim:rgba(10,10,10,.42);
  --sh:none;--sh2:none;--shq:0 1px 0 rgba(0,0,0,.03),0 10px 28px -14px rgba(0,0,0,.18);--dsh:none;--ssh:none;--tsh:none;--ksh:none;--psh:none;
  --dock:#0A0A0A;--dock-ink:#FFFFFF;--dock-on:#FFFFFF;--dock-on-ink:#0A0A0A;
  --card:#0A0A0A;--card-ink:#FFFFFF;--card-ink2:#9A9A9A;--card-peek:#2A2A2A;--card-peek2:#D9D9D9;
  --sheet:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#0A0A0A;--s1:#141414;--s2:#1D1D1D;--s3:#282828;--line:#232323;--line2:#333333;
  --ink:#FFFFFF;--ink2:#9C9C9C;--ink3:#626262;--stage:#000000;--scrim:rgba(0,0,0,.6);
  --sh:0 0 0 rgba(0,0,0,0);--sh2:0 24px 48px -20px rgba(0,0,0,.8);--shq:none;--ssh:0 -12px 40px -16px rgba(0,0,0,.35);--dsh:0 18px 36px -12px rgba(0,0,0,.45);--tsh:0 12px 30px -10px rgba(0,0,0,.5);--ksh:0 2px 6px rgba(0,0,0,.25);--psh:0 8px 22px rgba(0,0,0,.18);
  --dock:#1D1D1D;--dock-ink:#FFFFFF;--dock-on:#FFFFFF;--dock-on-ink:#0A0A0A;
  --card:#1D1D1D;--card-ink:#FFFFFF;--card-ink2:#8C8C8C;--card-peek:#2C2C2C;--card-peek2:#3A3A3A;
  --sheet:#141414;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A;--s1:#141414;--s2:#1D1D1D;--s3:#282828;--line:#232323;--line2:#333333;

    --dock:#1D1D1D;--dock-ink:#FFFFFF;--dock-on:#FFFFFF;--dock-on-ink:#0A0A0A;
    --card:#1D1D1D;--card-ink:#FFFFFF;--card-ink2:#8C8C8C;--card-peek:#2C2C2C;--card-peek2:#3A3A3A;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--stage);color:var(--ink);font-family:var(--ff);font-size:var(--t-body);font-weight:400;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
svg{display:block}
.stage{height:100dvh;display:grid;place-items:center}
.app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:560px){.app{height:min(900px,calc(100dvh - 32px));border-radius:46px;box-shadow:var(--sh2),0 0 0 1px var(--line)}}

/* type roles */
.title{font-size:var(--t-title);font-weight:600;letter-spacing:-.01em}
.sec{font-size:var(--t-sec);font-weight:600;letter-spacing:-.005em}
.body{font-size:var(--t-body)}
.meta{font-size:var(--t-meta);color:var(--ink2)}
.hero{font-size:var(--t-hero);font-weight:600;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .dec{color:var(--ink3)}
.name{font-size:var(--t-body);font-weight:500}
.num{font-weight:600;font-variant-numeric:tabular-nums}
.ink2{color:var(--ink2)}.ink3{color:var(--ink3)}

/* screens */
.screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:calc(var(--safe-t) + 14px) 20px calc(130px + var(--safe-b));scrollbar-width:none;will-change:transform}
.screen::-webkit-scrollbar{display:none}
.screen.nodock{padding-bottom:calc(40px + var(--safe-b))}
.screen.enter-r{animation:inR .5s var(--ease) both}
.screen.enter-f{animation:inF .35s var(--ease) both}
.screen.under{animation:underIn .5s var(--ease) both;pointer-events:none}
.screen.leave-r{animation:outR .42s var(--ease) both;pointer-events:none}
.screen.reveal{animation:revealIn .42s var(--ease) both}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes underIn{to{transform:translateX(-22%);opacity:.5}}
@keyframes outR{to{transform:translateX(100%)}}
@keyframes revealIn{from{transform:translateX(-22%);opacity:.5}to{transform:none;opacity:1}}
.rise>*{animation:rise .55s var(--ease) both}
.rise>*:nth-child(1){animation-delay:.02s}.rise>*:nth-child(2){animation-delay:.06s}.rise>*:nth-child(3){animation-delay:.1s}.rise>*:nth-child(4){animation-delay:.14s}.rise>*:nth-child(5){animation-delay:.18s}.rise>*:nth-child(6){animation-delay:.22s}.rise>*:nth-child(7){animation-delay:.26s}.rise>*:nth-child(8){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.still .rise>*,.still.screen{animation:none!important}

/* top bars */
.bar{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:14px}
.bar .grow{flex:1;min-width:0}
.bar .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none;position:relative;transition:transform .2s var(--spring),background .2s}
.ibtn:active{transform:scale(.88)}
.ibtn svg{width:20px;height:20px}
.ibtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 0 2px var(--s2)}
.ibtn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;font-size:var(--t-body);font-weight:600;letter-spacing:-.005em;transition:transform .2s var(--spring),opacity .2s,background .2s;position:relative;overflow:hidden;width:100%}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--s2);color:var(--ink)}
.btn.line{box-shadow:inset 0 0 0 1px var(--line2)}
.btn.y{background:var(--y);color:#0A0A0A}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{height:36px;padding:0 16px;width:auto;font-size:var(--t-meta);font-weight:600}
.btn.md{height:44px;width:auto}
.btn[disabled],.btn.off{opacity:.38;pointer-events:none}
.btn.text{height:44px;color:var(--ink2);font-weight:500}
.hold{--p:0;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;inset:0;background:var(--y);transform:scaleX(var(--p));transform-origin:left;z-index:0;transition:transform .28s var(--ease)}
.hold.holding i{transition:transform .9s linear}
.hold span{position:relative;z-index:1;display:flex;align-items:center;gap:8px;color:inherit}
.hold.holding,.hold.done{color:#0A0A0A}
.hold.holding{transform:scale(.98)}

/* cards & rows */
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--sh);position:relative}
.card.flat{box-shadow:none;background:var(--s2);border-color:transparent}
.stack{display:flex;flex-direction:column}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap28{gap:28px}
.hrow{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sech{display:flex;align-items:center;justify-content:space-between;margin:28px 0 8px}
.sech:first-child{margin-top:0}
.sech button{font-size:var(--t-meta);font-weight:500;color:var(--ink2);padding:6px 0 6px 10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left;width:100%;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row .grow .name,.row .grow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.row{transition:opacity .2s}
button.row:active{opacity:.6}
.list{display:flex;flex-direction:column}
.list.card{padding:4px 16px}
.chev{width:16px;height:16px;color:var(--ink3);flex:none}
.tile{width:40px;height:40px;border-radius:14px;background:var(--s2);display:grid;place-items:center;flex:none}
.tile svg{width:20px;height:20px}
.tile.money{background:var(--ink);color:var(--bg)}
.tile.ok{background:var(--ok);color:#06210f}
.tile.bad{background:var(--bad);color:#fff}
.tile.y{background:var(--y);color:#0A0A0A}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:var(--t-meta);font-weight:600;background:var(--s2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.y{background:var(--y);color:#0A0A0A}
.chip.ok{background:rgba(47,191,113,.16);color:var(--ok)}
.chip.bad{background:rgba(255,77,61,.14);color:var(--bad)}
.chip.ink{background:var(--ink);color:var(--bg)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.pills::-webkit-scrollbar{display:none}
.pill{height:38px;padding:0 16px;border-radius:999px;background:var(--s2);font-size:var(--t-body);font-weight:500;white-space:nowrap;flex:none;transition:transform .2s var(--spring),box-shadow .2s,background .2s;box-shadow:inset 0 0 0 1.5px transparent}
.pill:active{transform:scale(.94)}
.pill.on{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:600}
.seg{display:flex;background:var(--s2);border-radius:999px;padding:4px;position:relative}
.seg button{flex:1;height:36px;border-radius:999px;font-weight:500;font-size:var(--t-body);position:relative;z-index:1;color:var(--ink2);transition:color .25s}
.seg button.on{color:var(--bg);font-weight:600}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--ink);transition:transform .4s var(--spring)}

/* greeting + wallet card */
.greet{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.greet .av{width:44px;height:44px;flex:none}
.walletwrap{position:relative;padding-top:14px}
.peek{position:absolute;left:14px;right:14px;top:0;height:60px;border-radius:26px;background:var(--card-peek);transition:transform .5s var(--spring)}
.peek.p2{left:28px;right:28px;top:-8px;background:var(--card-peek2);opacity:.9}
.wcard{position:relative;background:var(--card);color:var(--card-ink);border-radius:26px;padding:18px 18px 18px;overflow:hidden;z-index:1}
.wcard .meta{color:var(--card-ink2)}
.wcard .hero .dec{color:var(--card-ink2)}
.wcard .mark{position:absolute;right:16px;top:16px}
.wcard .eye{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;margin-left:8px;transition:transform .2s var(--spring)}
.wcard .eye:active{transform:scale(.85)}
.wcard .eye svg{width:16px;height:16px}
.wcard .esc{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:var(--t-meta);color:var(--card-ink2)}
.wcard .esc b{color:var(--card-ink);font-weight:600}
.wcard .esc svg{width:14px;height:14px;color:var(--y)}
.blur{filter:blur(9px);transition:filter .3s;user-select:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--shq);border-radius:24px;padding:14px 8px;margin-top:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:var(--t-meta);font-weight:500}
.qa .qi{width:46px;height:46px;border-radius:50%;background:var(--s2);display:grid;place-items:center;transition:transform .25s var(--spring),background .2s}
.qa button:active .qi{transform:scale(.86) rotate(-6deg)}
.qa .qi svg{width:20px;height:20px}

/* due card */
.due{display:flex;align-items:center;gap:14px;padding:14px;border-radius:24px;background:var(--y);color:#0A0A0A;position:relative;overflow:hidden}
.due .meta{color:rgba(10,10,10,.62)}
.due .btn{background:#0A0A0A;color:#fff;width:auto;height:40px;padding:0 18px;font-size:var(--t-meta)}
.due.bad{background:var(--bad);color:#fff}.due.bad .meta{color:rgba(255,255,255,.8)}.due.bad .btn{background:#fff;color:#0A0A0A}
.due.ink{background:var(--ink);color:var(--bg)}.due.ink .meta{color:var(--ink3)}.due.ink .btn{background:var(--y);color:#0A0A0A}

/* faces */
.face{display:block;overflow:visible}
.face .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.avb{position:relative;display:inline-block;flex:none;transition:transform .3s var(--spring)}
.avb:active{transform:scale(.9)}
.avb.squash{animation:squash .5s var(--spring)}
@keyframes squash{0%{transform:scale(1)}25%{transform:scale(1.2,.8)}55%{transform:scale(.88,1.14)}100%{transform:scale(1)}}
.badge{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--bg)}
.badge svg{width:10px;height:10px;stroke-width:3.2}
.badge.ok{background:var(--ink);color:var(--bg)}
.badge.bad{background:var(--bad);color:#fff}
.badge.due{background:var(--s3);color:var(--ink2)}
.badge.y{background:var(--y);color:#0A0A0A}

/* ring hero */
.ringwrap{position:relative;width:min(100%,320px);aspect-ratio:1;margin:6px auto 0}
.ringwrap svg.rg{position:absolute;inset:0;width:100%;height:100%}
.ringwrap .mid{position:absolute;inset:23%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.ringwrap .slot{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%)}
.ringwrap .slot .avb{width:100%;height:100%}
.ringwrap .slot svg.face{width:100%;height:100%}
.ringwrap .slot.open .emp{width:100%;height:100%;border-radius:50%;border:1.5px dashed var(--ink3);display:grid;place-items:center;color:var(--ink3)}
.ringwrap .slot.open .emp svg{width:45%;height:45%}
.ringwrap .slot.now{z-index:3}
.ringwrap .slot.now .avb{transform:scale(1.22)}
.crown{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:20px;height:14px;z-index:2}
.ringwrap .bead{transform-origin:160px 160px}
.legend{display:flex;justify-content:center;gap:16px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:var(--t-meta);color:var(--ink2)}
.legend i{width:8px;height:8px;border-radius:50%;display:block}

/* timeline */
.tl{position:relative}
.tl .step{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl .step:last-child{padding-bottom:0}
.tl .step:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line2);border-radius:2px}
.tl .step.done:not(:last-child)::before{background:var(--ink)}
.tl .pt{width:32px;height:32px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none;font-size:var(--t-meta);font-weight:600;position:relative;z-index:1}
.tl .done .pt{background:var(--ink);color:var(--bg)}
.tl .now .pt{background:var(--y);color:#0A0A0A}
.tl .pt svg{width:14px;height:14px;stroke-width:3}

/* progress ring small */
.pr{position:relative;width:44px;height:44px;flex:none}
.pr>svg{width:100%;height:100%;transform:rotate(-90deg)}
.pr b{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--t-meta);font-weight:600}
.pr>svg circle{fill:none;stroke-width:5;stroke-linecap:round}
.pr>svg .t{stroke:var(--s3)}.pr>svg .v{stroke:var(--ink);transition:stroke-dashoffset 1s var(--ease)}

/* inputs */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:var(--t-meta);color:var(--ink2);font-weight:500}
.inp{height:54px;border-radius:18px;background:var(--s2);padding:0 18px;font-size:var(--t-sec);font-weight:500;width:100%;border:0;outline:0;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,background .2s}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent}
textarea.inp{height:110px;padding:14px 18px;resize:none;line-height:1.4}
.inp::placeholder{color:var(--ink3)}
.inp.big{height:68px;font-size:22px;font-weight:600;letter-spacing:.02em}
.inp.code{text-transform:uppercase;letter-spacing:.14em;text-align:center}
.phone{display:flex;gap:8px}
.phone .cc{height:54px;padding:0 16px;border-radius:18px;background:var(--s2);display:flex;align-items:center;gap:8px;font-weight:600;flex:none}
.switch{width:50px;height:30px;border-radius:999px;background:var(--s3);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--ksh);transition:transform .35s var(--spring)}
.switch.on{background:var(--ok)}.switch.on::after{transform:translateX(20px)}
.step-in{animation:stepIn .45s var(--ease) both}
.step-back{animation:stepBack .45s var(--ease) both}
@keyframes stepIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--s2);border-radius:22px;padding:8px}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:transform .2s var(--spring)}
.stepper button:active{transform:scale(.85)}
.stepper button svg{width:20px;height:20px}
.stepper .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.stepper .v small{display:block;font-size:var(--t-meta);color:var(--ink2);font-weight:400}
.dots{display:flex;gap:6px}
.dots i{height:6px;width:6px;border-radius:6px;background:var(--s3);transition:width .4s var(--spring),background .3s}
.dots i.on{width:22px;background:var(--ink)}
.shapegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shapegrid button{aspect-ratio:1;border-radius:22px;background:var(--s2);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px transparent;transition:transform .25s var(--spring),box-shadow .2s}
.shapegrid button svg{width:62%;height:62%}
.shapegrid button.on{box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent}
.shapegrid button:active{transform:scale(.9)}
.swatches{display:flex;gap:10px;justify-content:space-between}
.swatches button{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 0 var(--ink);transition:transform .25s var(--spring),box-shadow .2s}
.swatches button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink);transform:scale(1.05)}

/* sheets */
.layer{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .35s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--sheet);border-radius:32px 32px 0 0;padding:10px 20px calc(24px + var(--safe-b));transform:translateY(105%);transition:transform .5s var(--spring);pointer-events:auto;scrollbar-width:none;box-shadow:var(--ssh)}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--s3);margin:0 auto 18px}
.sheet h3{margin:0 0 4px;font-size:var(--t-title);font-weight:600;letter-spacing:-.01em}
.sheet .sub{color:var(--ink2);margin:0 0 18px}
.toasts{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 10px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:var(--t-body);font-weight:500;box-shadow:var(--tsh);animation:toastIn .6s var(--spring) both;max-width:calc(100% - 32px)}
.toast.out{animation:toastOut .35s var(--ease) both}
.toast .ti{width:28px;height:28px;border-radius:50%;background:var(--y);color:#0A0A0A;display:grid;place-items:center;flex:none}
.toast .ti svg{width:15px;height:15px;stroke-width:2.6}
@keyframes toastIn{from{transform:translateY(-70px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-40px) scale(.95);opacity:0}}

/* dock */
.dock{position:absolute;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--dock);z-index:20;box-shadow:var(--dsh);transition:transform .5s var(--spring),opacity .3s}
.dock.hide{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.dock button{height:46px;min-width:46px;border-radius:999px;color:var(--dock-ink);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 13px;font-size:var(--t-body);font-weight:600;transition:background .35s var(--ease),color .35s,padding .45s var(--spring),transform .2s var(--spring);overflow:hidden}
.dock button:active{transform:scale(.9)}
.dock button svg{width:21px;height:21px;flex:none}
.dock button span{max-width:0;opacity:0;white-space:nowrap;transition:max-width .45s var(--spring),opacity .3s}
.dock button.on{background:var(--dock-on);color:var(--dock-on-ink);padding:0 18px 0 15px}
.dock button.on span{max-width:90px;opacity:1}
.dock button:not(.on){opacity:.7}
.dock .ndot{position:absolute}

/* splash / onboarding */
.splash{position:absolute;inset:0;z-index:100;background:#0A0A0A;color:#fff;display:grid;place-items:center;transition:opacity .6s var(--ease),transform .7s var(--ease)}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash .lg{display:flex;flex-direction:column;align-items:center;gap:22px}
.splash .word{font-size:34px;font-weight:600;letter-spacing:-.03em;display:flex}
.splash .word span{display:inline-block;opacity:0;transform:translateY(16px);animation:wl .6s var(--spring) forwards}
@keyframes wl{to{opacity:1;transform:none}}
.ob{display:flex;flex-direction:column;min-height:100%;padding-top:6px}
.ob .art{flex:1;display:grid;place-items:center;position:relative;min-height:330px;margin:0 -20px;overflow:hidden}
.ob h1{font-size:28px;line-height:1.08;font-weight:600;letter-spacing:-.03em;margin:0 0 10px}
.ob p{margin:0;color:var(--ink2);line-height:1.45}
.ob .foot{padding:18px 0 4px;display:flex;flex-direction:column;gap:12px}
.float{animation:flt 5s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px) rotate(3deg)}}
.float.b{animation-delay:-1.6s;animation-duration:6s}.float.c{animation-delay:-3.2s;animation-duration:4.4s}
.mini{width:272px;transform-origin:center}
.mini .card{padding:14px}
.slides{display:flex;width:100%;transition:transform .55s var(--spring)}
.slide{flex:none;width:100%}

/* pin */
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:26px}
.pindots{display:flex;gap:16px;height:16px}

  const t=tile?`<rect width="64" height="64" rx="18" fill="${bg}"/>`:'';
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-label="Rondo">${t}<circle cx="32" cy="32" r="16" fill="none" stroke="${ring}" stroke-width="7" stroke-linecap="round" stroke-dasharray="80 20.5" transform="rotate(-8.5 32 32)"/><circle cx="43.3" cy="20.7" r="6.4" fill="#FFD60A"/></svg>`;
}
function iconURI(size,maskable){
  const pad=maskable?10:0;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 64 64"><rect width="64" height="64" fill="#0A0A0A"${maskable?'':' rx="18"'}/><g transform="translate(${pad/2*0} 0)"><circle cx="32" cy="32" r="${maskable?13:16}" fill="none" stroke="#fff" stroke-width="${maskable?5.6:7}" stroke-linecap="round" stroke-dasharray="${maskable?'65 16.7':'80 20.5'}" transform="rotate(-8.5 32 32)"/><circle cx="${maskable?41.2:43.3}" cy="${maskable?22.8:20.7}" r="${maskable?5.2:6.4}" fill="#FFD60A"/></g></svg>`;
  return 'data:image/svg+xml;base64,'+btoa(svg);
}

/* ---------- the Rondo ring ---------- */
function ringHTML(o){
  /* o: {slots:[member|null], cur:index, done:n, states:{id:state}, pot, label, sub, anim:true} */
  const n=o.slots.length,R=128,C=2*Math.PI*R,sl=360/n;
  const arc=Math.max(0,Math.min(o.done,n))/n*C;
  const ang=(o.cur??0)*sl;
  let slots='';
  o.slots.forEach((m,i)=>{
    const a=(-90+i*sl)*Math.PI/180,x=50+40*Math.cos(a),y=50+40*Math.sin(a);
    const isNow=i===o.cur&&o.active!==false;
    if(!m||m.status==='open'){
      slots+=`<div class="slot open" style="left:${x}%;top:${y}%"><div class="emp">${icon('plus')}</div></div>`;return;
    }
    const st=o.states?.[m.id];
    let b='';
    if(i<o.done)b=bdg('y');else if(st==='paid')b=bdg('ok');else if(st==='late'||st==='covered')b=bdg('bad');else if(st==='due')b=bdg('due');
    const crown=isNow?`<svg class="crown" viewBox="0 0 20 14"><path d="M1 12 2.500 3 7 7.500 10 1l3 6.500L17.500 3 19 12z" fill="#FFD60A" stroke="#0A0A0A" stroke-width="1.400" stroke-linejoin="round"/></svg>`:'';
    slots+=`<div class="slot${isNow?' now':''}" style="left:${x}%;top:${y}%" data-act="member" data-id="${m.id}">${crown}${av(m,100,b).replace('width:100px;height:100px','width:100%;height:100%')}</div>`;
  });
  return `<div class="ringwrap"><svg class="rg" viewBox="0 0 320 320"><circle cx="160" cy="160" r="${R}" fill="none" stroke="var(--line2)" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/><circle cx="160" cy="160" r="${R}" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${arc.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 160 160)" style="${o.anim===false?'':'--c:'+C.toFixed(1)+';animation:arcIn 1.4s var(--ease) both'}"/><g class="bead" style="${o.cur<0?'display:none;':''}--a:${ang}deg;transform:rotate(${ang}deg);${o.anim===false||o.active===false?'':'animation:orbit 1.7s var(--ease) both'}"><circle cx="160" cy="32" r="9" fill="#FFD60A" stroke="var(--bg)" stroke-width="3.500"/></g></svg><div class="mid">${o.mid||''}</div>${slots}</div>`;
}

/* ---------- bending arrows: one tapered ribbon per screen ---------- */
function obSpline(pts,n=90){
  const P=[pts[0],...pts,pts[pts.length-1]],out=[];
  for(let i=1;i<P.length-2;i++){
    for(let k=0;k<n/(pts.length-1);k++){
      const t=k/(n/(pts.length-1)),t2=t*t,t3=t2*t,p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
      out.push([0,1].map(c=>.5*((2*p1[c])+(-p0[c]+p2[c])*t+(2*p0[c]-5*p1[c]+4*p2[c]-p3[c])*t2+(-p0[c]+3*p1[c]-3*p2[c]+p3[c])*t3)));
    }
  }
  out.push(pts[pts.length-1]);return out;
}
function obRibbon(pts,{w=22,color,headAt=.8,headW=1.9}){
  const c=obSpline(pts),n=c.length,L=[],R=[];
  const nrm=i=>{const a=c[Math.max(0,i-1)],b=c[Math.min(n-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return [-dy/l,dx/l]};
  const sm=t=>t*t*(3-2*t);
  const hs=Math.floor(n*headAt);
  const push=(i,hw)=>{const [nx,ny]=nrm(i);L.push([c[i][0]+nx*hw,c[i][1]+ny*hw]);R.push([c[i][0]-nx*hw,c[i][1]-ny*hw])};
  for(let i=0;i<=hs;i++){const t=i/hs;push(i,w*(.08+.42*sm(Math.min(1,t/.7))))}
  const hb=w*headW/2;
  for(let i=hs;i<n;i++){const t=(i-hs)/(n-1-hs);push(i,hb*(1-t))}
  const poly=[...L,...R.reverse()];
  return `<path d="M${poly.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')}Z" fill="${color}" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
}
const AR={lime:'#B7F34D',pink:'#FFB4D2',purple:'#9B7BFF'};

}

function ensureRound(c){
  if(c.status!=='active'||c.pay[c.round])return;
  const due=dueAt(c),r={};
  c.members.forEach(m=>{

    const w=m.you?null:m.habit==='early'?due-rnd(1,2.5)*DAY:m.habit==='late'?due+rnd(.2,1)*DAY:m.habit==='flaky'?null:due-rnd(0,.7)*DAY;

function doPay(c,{auto=false,half=false}={}){

    addTx({kind:'pay',amount:-part,title:c.name,sub:`Part payment · round ${c.round+1}`,circle:c.id});
    clog(c,`You paid ${money(part)} of ${money(owes(c))}`);return part;
  }

  S.bal-=tot;p.s='paid';p.at=now();p.part=0;
  addTx({kind:'pay',amount:-tot,title:c.name,sub:`Contribution · round ${c.round+1}${late?' · late':''}${auto?' · auto-pay':''}`,circle:c.id});
  clog(c,auto?`Auto-pay sent ${money(tot)}`:`You paid ${money(tot)}`);adjTrust(late?1:2);
  S.stats=S.stats||{on:0,late:0};late?S.stats.late++:S.stats.on++;

}

function contributed(c){let n=0;for(let r=0;r<=Math.min(c.round,c.size-1);r++){const p=c.pay[r]&&c.pay[r].me;if(p&&p.s==='paid')n++}return n*owes(c)}
function remainingOwed(c){let n=0;for(let r=c.round;r<c.size;r++){const p=c.pay[r]&&c.pay[r].me;if(!(p&&p.s==='paid'))n++}const cp=c.pay[c.round]&&c.pay[c.round].me;return n*owes(c)-(cp&&cp.s!=='paid'&&cp.part||0)}
function gotPaid(c){return c.payouts.some(p=>p.id==='me')}
function finishLeave(c){

}
function startCircle(c,startTs){

}
function addJoin(c){
  const left=c.size-slotsTaken(c);
  const m=c.pool&&c.pool.length?c.pool.shift():newMember(left>=2&&Math.random()<.22?{hands:2}:{});
  if(hands(m)>left)m.hands=1;
  c.members.push(m);
  const slot=c.members.findIndex(x=>x.status==='open');
  clog(c,`${m.name} joined`);
  notify({title:`${m.name} joined ${c.name}`,body:`${slotsTaken(c)} of ${c.size} turns are filled.`,kind:'join',circle:c.id,icon:'userplus'});
}

/* ---------- tick: the clock that moves every circle ---------- */
function tick(){
  let ch=false;const t=now(),rt=Date.now();
  for(const c of S.circles){
    if(c.status==='forming'&&c.sim&&rt>=c.sim.next&&slotsTaken(c)<c.size){
      addJoin(c);ch=true;c.sim.next=rt+rnd(4500,7500);
      if(slotsTaken(c)>=c.size){
        c.sim=null;c.full=true;
        if(c.auto){startCircle(c,t+(c.startIn||7)*DAY);const ix=c.order.indexOf('me')+1;notify({title:`${c.name} is full and the order is drawn`,body:`You collect in round ${ix}.`,kind:'start',circle:c.id,icon:'spark'});confetti({count:60})}
        else notify({title:`${c.name} is full`,body:'Draw the payout order to start.',kind:'full',circle:c.id,icon:'spark'});
      }
    }
    if(c.status!=='active')continue;
    for(const m of c.members){if(m.status==='leaving'&&m.repAt&&rt>=m.repAt){finishLeave(c);ch=true;break}}
    if(!S.circles.includes(c))continue;
    ensureRound(c);
    if(Math.random()<.004&&boardChatter(c))ch=true;
    if(c.status==='active'&&!c.swapIn&&!c.swapReq&&Math.random()<.003&&makeIncoming(c))ch=true;
    const r=c.pay[c.round],due=dueAt(c);
    if(c.swapReq&&rt>=c.swapReq.res){resolveSwap(c);ch=true}
    const mp=r.me;
    if(mp&&mp.s==='due'){
      if(c.ap&&c.ap.on&&t>=due-DAY){
        const need=payTotal(c);
        if(S.bal>=need&&need<=c.ap.cap){doPay(c,{auto:true});ch=true;notify({title:`Auto-pay sent ${short(need)} to ${c.name}`,body:'Held in escrow until payout.',kind:'paid',circle:c.id,icon:'bolt'})}
        else if(!mp.apWarn){mp.apWarn=1;ch=true;notify({title:`Auto-pay could not run for ${c.name}`,body:S.bal<payTotal(c)?'Your wallet is short. Add money before the due date.':'The amount is above your cap.',kind:'late',circle:c.id,icon:'alert'})}
      }
      if(mp.s==='due'&&!mp.rem&&remOn(c)&&t>=due-leadMs(c)){mp.rem=1;ch=true;notify({title:`${c.name} is due ${fin(due)}`,body:`${money(payTotal(c))} · tap to pay`,kind:'info',circle:c.id,icon:'bell'})}
    }
    for(const m of c.members){
      const p=r[m.id];if(!p)continue;
      if((p.s==='due'||p.s==='late')&&!m.you&&p.w!=null&&t>=p.w){
        p.s='paid';p.at=Math.min(t,p.w);ch=true;clog(c,`${m.name} paid ${money(owes(c,m))}`);
        notify({title:`${m.name} paid ${short(owes(c,m))} to ${c.name}`,body:`${paidN(c)} of ${activeN(c)} are in.`,kind:'paid',circle:c.id,icon:'check'});
        if(settled(c)&&rcvOf(c)&&rcvOf(c).you&&!held(c))notify({title:`Your ${short(pot(c))} from ${c.name} is ready`,body:'Everyone has paid. Collect it now.',kind:'ready',circle:c.id,icon:'coin'});
        continue;
      }
      if(p.s==='due'&&t>due){p.s='late';p.fee=lateFee(c,m);ch=true;clog(c,`${m.you?'You are':m.name+' is'} late`);notify({title:m.you?`Your ${c.name} payment is late`:`${m.name} is late on ${c.name}`,body:m.you?`A ${c.fee}% late fee applies. Pay within ${c.grace} days.`:`Grace period ends ${fin(due+c.grace*DAY)}.`,kind:'late',circle:c.id,icon:'alert'})}
      if(p.s==='late'&&t>due+c.grace*DAY){
        p.s='covered';ch=true;m.covered=true;m.trust=Math.max(10,(m.trust||60)-10);if(m.you)adjTrust(-8);if(m.vouch==='me'){adjTrust(-5);notify({title:`${m.name} missed a payment`,body:'You vouched for them, so your trust score dropped by 5.',kind:'late',circle:c.id,icon:'shield'})}
        clog(c,`${m.you?'Your':m.name+'’s'} safety deposit covered the round`);
        notify({title:m.you?`Your deposit covered ${c.name}`:`${m.name}’s deposit covered ${c.name}`,body:m.you?'Top up to keep your trust score.':'The pot is whole. Their score dropped.',kind:'covered',circle:c.id,icon:'shield'});
        if(settled(c)&&rcvOf(c)&&rcvOf(c).you&&!held(c))notify({title:`Your ${short(pot(c))} from ${c.name} is ready`,body:'Collect it now.',kind:'ready',circle:c.id,icon:'coin'});
      }
    }
    if(settled(c)&&t>=due&&!held(c)){const rc=rcvOf(c);if(rc&&!rc.you){closeRound(c);ch=true}}
    if(c.dispute&&c.dispute.status!=='resolved'){
      const d=c.dispute,el=t-d.at;
      if(d.status==='open'&&el>12*HOUR){d.status='review';ch=true;notify({title:'Members are voting on your report',body:c.name,kind:'dispute',circle:c.id,icon:'vote'})}
      if(tickDispute(c,t))ch=true;
      if(d.status==='review'&&el>48*HOUR){const tl=tally(d);d.status='resolved';d.upheld=tl.up>=tl.down;d.outcome=tl.up||tl.down?`Members voted ${tl.up} to ${tl.down}. Rondo reviewed the ledger and the deposit, and the case is closed.`:'We checked the ledger and the member’s deposit. The affected amount is released and the case is closed.';ch=true;notify({title:d.by==='me'||!d.by?'Your report is resolved':'A report is resolved',body:c.name+' · funds released',kind:'dispute',circle:c.id,icon:'shieldok'})}
    }
  }
  if(ch){save();refreshSoft()}
}

/* ---------- circle detail ---------- */
function slotsFor(c){
  if(c.status==='forming'){const a=c.members.filter(m=>m.status!=='left').flatMap(m=>Array(hands(m)).fill(m));return Array.from({length:c.size},(_,i)=>a[i]||null)}
  return c.order.map(id=>memOf(c,id));
}
function stateMap(c){const r=c.pay[c.round]||{},o={};for(const k in r)o[k]=r[k].s;return o}
function heroMid(c){
  const big=money(pot(c)).length>9;
  if(c.status==='forming')return `<div class="meta">Joined</div><div class="hero">${slotsTaken(c)}<span class="dec">/${c.size}</span></div><div class="meta">${c.full?'Everyone is in':'Waiting for friends'}</div>`;
  if(c.status==='done')return `<div class="meta">Complete</div><div class="hero">${c.size}<span class="dec">/${c.size}</span></div><div class="meta">${money(pot(c))} pot</div>`;
  return `<div class="meta">Round ${c.round+1} of ${c.size}</div><div class="hero" style="${big?'font-size:26px':''}">${money(pot(c))}</div><div class="meta">Due ${fdate(dueAt(c))}</div>`;
}
function memberRow(c,m){
  const r=c.pay[c.round]||{},p=r[m.id],due=dueAt(c);
  if(m.status==='open')return `<div class="row"><div class="emp" style="width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--ink3);display:grid;place-items:center;color:var(--ink3);flex:none">${icon('plus')}</div><div class="grow"><div class="name">Open slot</div><div class="meta">Deposit covers it until someone joins</div></div>${c.org==='me'?`<button class="btn sm sec" data-act="fillslot" data-id="${m.id}">Invite</button>`:''}</div>`;
  let meta='',right='';
  if(p&&p.s==='paid'){meta=`Paid ${fdate(p.at)}, ${ftime(p.at)}`;right=`<span class="chip ok">${icon('check')}Paid</span>`}
  else if(p&&p.s==='late'){meta=`Late · grace ends ${fin(due+c.grace*DAY).replace('in ','in ')}`;right=m.you?`<button class="btn sm pri" data-act="pay" data-id="${c.id}">Pay</button>`:`<button class="btn sm sec" data-act="nudge" data-id="${m.id}">${icon('send')}Nudge</button>`}
  else if(p&&p.s==='covered'){meta='Covered by safety deposit';right=m.you?`<button class="btn sm pri" data-act="pay" data-id="${c.id}">Top up</button>`:`<span class="chip bad">Covered</span>`}
  else if(p&&p.s==='due'){meta=`Due ${fin(due)}`;right=m.you?`<button class="btn sm pri" data-act="pay" data-id="${c.id}">Pay</button>`:(m.nudged&&m.nudged>now()-12*HOUR?`<span class="chip">Nudged</span>`:`<button class="btn sm sec" data-act="nudge" data-id="${m.id}">${icon('send')}Nudge</button>`)}
  else if(m.status==='leaving'){meta='Leaving · waiting for a replacement';right=`<span class="chip">Leaving</span>`}
  return `<div class="row"><button data-act="member" data-id="${m.id}">${av(m,44)}</button><div class="grow"><div class="name">${esc(m.name)}${m.you?' <span class="ink3" style="font-weight:400">(you)</span>':''}${hands(m)>1?' <span class="chip" style="height:20px;padding:0 7px;font-size:11px">2 hands</span>':''}</div><div class="meta">${meta}${p&&p.part&&p.s!=='paid'?' · part paid':''}</div></div>${right}</div>`;
}
function taskBlock(c){
  const me=meOf(c),p=myP(c),rc=rcvOf(c),st=settled(c);
  if(me.status==='leaving')return `<div class="note">${icon('clock')}<div><div class="name">You are leaving this circle</div><div class="meta" style="margin-top:2px">Your refund arrives as soon as a replacement joins. That is usually within a day.</div></div></div>`;
  if(rc&&rc.you&&st&&held(c))return `<div class="note y">${icon('flag')}<div><div class="name">Your payout is on hold</div><div class="meta" style="margin-top:2px">It is released when the open report is resolved.</div></div></div>`;
  if(rc&&rc.you&&st)return `<div class="due ink"><div class="tile">${icon('coin')}</div><div class="grow"><div class="name">${money(pot(c))} is ready</div><div class="meta">Everyone has paid in.</div></div><button class="btn" data-act="collect" data-id="${c.id}">Collect</button></div>`;
  if(p&&(p.s==='late'||p.s==='covered'))return `<div class="due bad"><div class="tile">${icon('alert')}</div><div class="grow"><div class="name">Your payment is late</div><div class="meta">${money(owes(c)-((p&&p.part)||0))} + ${money(lateFee(c))} late fee</div></div><button class="btn" data-act="pay" data-id="${c.id}">Pay now</button></div>`;
  if(p&&p.s==='due')return `<div class="due"><div class="tile">${icon('up')}</div><div class="grow"><div class="name">Pay ${money(payTotal(c))}</div><div class="meta">${p.part?'Part paid · ':''}Due ${fdate(dueAt(c))} · ${fin(dueAt(c))}</div></div><button class="btn" data-act="pay" data-id="${c.id}">Pay</button></div>`;
  const n=activeN(c)-paidN(c);
  return `<div class="note">${icon('shieldok')}<div><div class="name">You are paid up</div><div class="meta" style="margin-top:2px">${rc&&rc.you?(n?`Waiting on ${n} ${n===1?'member':'members'}. Your payout unlocks when everyone has paid.`:'Everyone has paid.'):(n?`Waiting on ${n} ${n===1?'member':'members'}. ${rc?esc(rc.name)+' collects when everyone has paid.':''}`:'Everyone has paid.')}</div></div></div>`;
}

const D={myHands:1,purpose:'',step:0,name:'',look:{shape:'flower',color:'#FFD60A',mood:'happy'},amount:0,custom:false,freq:'monthly',size:6,startIn:3,deposit:true,grace:2,fee:2,dir:1};

  if(s==='safety')return `<h1 class="h1">Set the safety net</h1><p class="ink2" style="margin:8px 0 18px">These rules apply to everyone and are shown before anyone joins.</p><div class="list card"><div class="row"><div class="tile">${icon('lock')}</div><div class="grow"><div class="name">Safety deposit</div><div class="meta" id="dpm">${D.deposit?`${money(D.amount)} held until the end`:'Off'}</div></div><button class="switch ${D.deposit?'on':''}" data-act="cdep" aria-label="Safety deposit"></button></div><div class="row"><div class="tile">${icon('clock')}</div><div class="grow"><div class="name">Grace period</div><div class="meta">After the due date</div></div><div class="stepper" style="padding:4px;border-radius:999px;gap:2px"><button data-act="cgrace" data-k="-1" style="width:34px;height:34px">${icon('minus')}</button><div class="v" style="font-size:var(--t-body);min-width:46px"><span id="cg">${D.grace}</span> d</div><button data-act="cgrace" data-k="1" style="width:34px;height:34px">${icon('plus')}</button></div></div><div class="row"><div class="tile">${icon('alert')}</div><div class="grow"><div class="name">Late fee</div><div class="meta">Into the pot</div></div><div class="pills" style="margin:0;padding:0;gap:6px" id="lf">${[0,2,5].map(f=>`<button class="pill ${D.fee===f?'on':''}" data-act="cfee" data-k="${f}" style="height:34px;padding:0 12px">${f?f+'%':'None'}</button>`).join('')}</div></div></div><div class="note" style="margin-top:14px">${icon('shieldok')}<div class="meta" style="color:var(--ink)">Every member is ID checked before they join. If someone misses a payment after the grace period, the deposit covers the pot.</div></div>`;
  return `<h1 class="h1">Ready to start ${esc(D.name||'your circle')}?</h1><div class="card" style="margin:18px 0 14px"><div class="hrow" style="gap:14px;margin-bottom:12px">${face(D.look,52)}<div class="grow"><div class="title">${esc(D.name||'Your circle')}</div><div class="meta">${D.size} turns · ${FREQ[D.freq].toLowerCase()}</div></div></div><div class="hr" style="margin:6px 0 10px"></div><div class="kv"><span class="k">Everyone pays</span><span class="v">${money(D.amount)}</span></div><div class="kv"><span class="k">Pot each round</span><span class="v">${money(D.amount*D.size)}</span></div><div class="kv"><span class="k">Rounds</span><span class="v">${D.size}</span></div>${D.myHands>1?`<div class="kv"><span class="k">Your hands</span><span class="v">${D.myHands} · ${money(D.amount*D.myHands)} each round</span></div>`:''}<div class="kv"><span class="k">First due</span><span class="v">${fdate(now()+D.startIn*DAY)}</span></div><div class="kv"><span class="k">Grace and late fee</span><span class="v">${D.grace} days · ${D.fee?D.fee+'%':'none'}</span></div><div class="kv big"><span class="k">${D.deposit?'Your deposit today':'Due today'}</span><span class="v">${D.deposit?money(D.amount*D.myHands):money(0)}</span></div></div>${D.purpose?`<div class="hrow" style="gap:8px;margin-bottom:12px"><span class="chip">${icon('target')}${esc(D.purpose)}</span></div>`:''}<p class="hint">You will be the organiser. Friends join with a link or code, accept the circle agreement, and you set the payout order once everyone is in.</p>`;
}

/* ---------- circle: one calm summary, with drill-down pages ---------- */
const uniq=a=>[...new Set(a)];
const nxt=(c,i)=>{const w=(c.order||[]).findIndex((x,k)=>x===i&&k>=c.round);return w};
function navRow(o){
  return `<button class="row nav" data-act="${o.act}" data-id="${o.id}"${o.k!=null?` data-k="${o.k}"`:''}><div class="tile ${o.tone||''}">${icon(o.ic)}</div><div class="grow"><div class="name">${o.title}</div><div class="meta">${o.meta||''}</div></div>${o.badge||''}${icon('chevR','chev')}</button>`;
}
function lastMsg(c){const b=(c.board||[])[0];if(!b)return 'Say hi to the circle';const m=b.who==='me'?meOf(c):memOf(c,b.who);return `${m?(m.you?'You':esc(m.name)):''}: ${esc(b.text)}`}
function disputeCard(c){
  const d=c.dispute,steps=[['Opened',d.at],['Under review',d.status!=='open'?d.at+12*HOUR:null],['Resolved',d.status==='resolved'?d.at+48*HOUR:null]];
  return `<div class="sech"><div class="sec">Report</div><span class="chip ${d.status==='resolved'?'ok':'y'}">${d.status==='resolved'?'Resolved':d.status==='review'?'In review':'Open'}</span></div><div class="card">${d.by&&d.by!=='me'?`<div class="meta" style="margin-bottom:6px">${esc((memOf(c,d.by)||{}).name||'A member')} reported${d.against?' '+esc((memOf(c,d.against)||{}).name||''):''}</div>`:''}<div class="name">${esc(d.reason)}</div><div class="meta" style="margin:2px 0 14px;white-space:normal">${esc(d.text||'No extra details')}${d.evidence&&d.evidence.length?` · ${d.evidence.length} file${d.evidence.length>1?'s':''} attached`:''}</div><div class="tl">${steps.map((s,i)=>`<div class="step ${s[1]?'done':''}"><div class="pt">${s[1]?icon('check'):i+1}</div><div class="grow" style="padding-top:5px"><div class="name" style="${s[1]?'':'color:var(--ink3)'}">${s[0]}</div>${s[1]?`<div class="meta">${fdate(s[1])}, ${ftime(s[1])}</div>`:''}</div></div>`).join('')}</div>${voteBlock(c)}${d.status==='resolved'?`<div class="note" style="margin-top:14px">${icon('shieldok')}<div class="meta" style="color:var(--ink);white-space:normal">${esc(d.outcome)}</div></div>`:d.by==='me'||!d.by?`<button class="btn sec md" style="margin-top:14px;width:100%" data-act="evidence">${icon('upload')}Add evidence</button>`:''}</div>`;

function rulesCard(c){

}
function summaryRows(c){
  const act=c.status==='active',frm=c.status==='forming',dn=c.status==='done',rows=[];
  if(act){
    const late=Object.values(c.pay[c.round]||{}).filter(x=>x.s==='late').length;
    rows.push(navRow({act:'cround',id:c.id,ic:'users',title:'This round',meta:`${paidN(c)} of ${activeN(c)} paid${late?` · ${late} late`:''}`}));
    const k=nxt(c,'me'),rc=rcvOf(c);
    rows.push(navRow({act:'cpayout',id:c.id,ic:'cal',title:'Payout order',meta:k>=0?`You collect ${fdate(dueAt(c,k))}`:rc?`${esc(rc.name)} collects next`:'',badge:c.swapIn?`<span class="chip y">Request</span>`:c.swapReq?`<span class="chip">Pending</span>`:''}));
  }
  if(!dn){const un=boardUnread(c);rows.push(navRow({act:'board',id:c.id,ic:'chat',title:'Board',meta:lastMsg(c),badge:un?`<span class="chip y">${un}</span>`:''}))}
  rows.push(navRow({act:'crules',id:c.id,ic:'doc',title:'Rules and agreement',meta:`${money(c.amount)} ${FREQ[c.freq].toLowerCase()} · ${c.fee?c.fee+'% late fee':'no late fee'}`}));
  if(c.log.length)rows.push(navRow({act:'clog',id:c.id,ic:'clock',title:'Activity',meta:esc(c.log[0].text)}));

V.cround=({id})=>{
  const c=getC(id);if(!c)return subGone();
  const ms=uniq(c.order||c.members.map(m=>m.id)).map(i=>memOf(c,i)).filter(m=>m&&(m.status==='open'||(c.pay[c.round]&&c.pay[c.round][m.id])));

};
V.cpayout=({id})=>{
  const c=getC(id);if(!c)return subGone();

  const st=c.swapReq?`<div class="note" style="margin-bottom:14px">${icon('clock')}<div><div class="name">Swap request sent</div><div class="meta" style="margin-top:2px">Waiting for ${esc((memOf(c,c.swapReq.with)||{}).name||'them')} to answer.</div></div></div>`:'';
  return `<div class="rise">${bar('Payout order',{sub:esc(c.name)})}${swapInCard(c)}${st}<div class="card"><div class="tl">${c.order.map((i,k)=>{
    const m=memOf(c,i),d=k<c.round?'done':k===c.round?'now':'';seen[i]=(seen[i]||0)+1;const dup=c.order.filter(x=>x===i).length>1;

const PAY={c:null,total:0};
A.pay=t=>{
  const c=getC(t.dataset.id)||curC();if(!c)return;

A.pg=t=>{
  const k=t.dataset.k;
  if(k==='ff2'){S.skew+=2*DAY;save();tick();refresh();toast('Moved ahead 2 days','clock')}
  else if(k==='leave'){
    let done=false;
    for(const c of S.circles){
      if(c.status!=='active')continue;
      const m=c.members.find(x=>!x.you&&x.status==='active'&&c.order.indexOf(x.id)>c.round&&c.org!==x.id);
      if(m){m.status='open';if(c.pay[c.round])c.pay[c.round][m.id]={s:'covered',at:now()};clog(c,`${m.name} left. Their deposit covers the slot.`);notify({title:`${m.name} left ${c.name}`,body:'Their deposit covers the slot until someone joins.',kind:'leave',circle:c.id,icon:'logout',toast:false});toast(`${m.name} left ${c.name}`,'logout');done=true;break}
    }
    if(!done)toast('No one can leave right now','info');save();refresh();
  }
  else if(k==='swapin'){
    let ok=false;for(const c of S.circles){if(c.status==='active'){c.swapIn=null;if(makeIncoming(c)){ok=true;break}}}
    if(!ok)toast('No circle can take a request','info');else{save();refresh();toast('A member asked to swap turns','swap')}
  }
  else if(k==='dispute'){
    const c=S.circles.find(x=>x.status==='active'&&(!x.dispute||x.dispute.status==='resolved')&&x.members.filter(m=>m.status==='active').length>=4);
    if(!c){toast('No circle can take a new report','info');return}
    const o=c.members.filter(m=>!m.you&&m.status==='active'),by=o[0],ag=o[o.length-1];
    dispReport(c,'A member has not paid',`${ag.name} has said they will pay for two rounds and has not.`,by.id,ag.id);
    notify({title:`${by.name} reported ${ag.name}`,body:`${c.name} · cast your vote`,kind:'dispute',circle:c.id,icon:'vote'});
    save();refresh();toast('Report raised. Open the circle to vote.','vote');
  }
  else if(k==='resolve'){
    let n=0;for(const c of S.circles)if(c.dispute&&c.dispute.status!=='resolved'){c.dispute.at=now()-49*HOUR;n++}
    if(!n){toast('No open reports','info');return}tick();save();refresh();toast('Reports resolved','shieldok');
  }
  else if(k==='reset'){seedData();refresh();toast('Sample circles restored','refresh')}
  else if(k==='clear'){S.circles=[];S.txs=[];S.notifs=[];S.goals=[];S.bal=0;save();refresh();toast('Everything cleared','trash')}
};

/* ---------- tiny QR encoder: byte mode, ECC level L, versions 1-6 ---------- */
const QR=(()=>{
  const EXP=new Array(512),LOG=new Array(256);
  (()=>{let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255]})();
  const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  function rs(data,n){
    let g=[1];
    for(let i=0;i<n;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i])}g=ng}
    const r=new Array(n).fill(0);
    for(const d of data){const f=d^r[0];r.shift();r.push(0);if(f)for(let i=0;i<n;i++)r[i]^=mul(g[i+1],f)}
    return r;
  }
  /* version: [data codewords, ec per block, blocks, alignment centre] */
  const VER=[null,[19,7,1,null],[34,10,1,18],[55,15,1,22],[80,20,1,26],[108,26,1,30],[136,18,2,34]];
  function build(text){
    const bytes=[...new TextEncoder().encode(text)];
    let v=1;while(v<=6&&VER[v][0]<bytes.length+2)v++;
    if(v>6)return null;
    const [dc,ecn,nb,al]=VER[v],size=17+4*v;
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>i)&1)};
    put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,dc*8-bits.length));while(bits.length%8)bits.push(0);
    const cw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];cw.push(b)}
    for(let p=0;cw.length<dc;p++)cw.push(p%2?0x11:0xec);
    const per=dc/nb,blocks=[],ecs=[];
    for(let i=0;i<nb;i++){const b=cw.slice(i*per,(i+1)*per);blocks.push(b);ecs.push(rs(b,ecn))}
    const fin=[];
    for(let i=0;i<per;i++)blocks.forEach(b=>fin.push(b[i]));
    for(let i=0;i<ecn;i++)ecs.forEach(e=>fin.push(e[i]));
    const m=Array.from({length:size},()=>new Array(size).fill(null)),fn=Array.from({length:size},()=>new Array(size).fill(false));
    const set=(x,y,val)=>{m[y][x]=val;fn[y][x]=true};
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=size||y>=size)continue;const d=Math.max(Math.abs(dx),Math.abs(dy));set(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    if(al){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(al+dx,al+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    for(let i=8;i<size-8;i++){set(i,6,i%2===0);set(6,i,i%2===0)}
    set(8,size-8,true);
    for(let i=0;i<9;i++){if(!fn[8][i])set(i,8,false);if(!fn[i][8])set(8,i,false)}
    for(let i=0;i<8;i++){if(!fn[8][size-1-i])set(size-1-i,8,false);if(!fn[size-1-i][8])set(8,size-1-i,false)}
    const bitsAll=[];fin.forEach(b=>put2(b));function put2(b){for(let i=7;i>=0;i--)bitsAll.push((b>>i)&1)}
    const place=mask=>{
      const g=m.map(r=>[...r]);let k=0,up=true;
      for(let x=size-1;x>0;x-=2){
        if(x===6)x--;
        for(let i=0;i<size;i++){
          const y=up?size-1-i:i;
          for(let dx=0;dx<2;dx++){
            const xx=x-dx;if(fn[y][xx])continue;
            let b=k<bitsAll.length?bitsAll[k]:0;k++;
            const mk=[(xx+y)%2===0,y%2===0,xx%3===0,(xx+y)%3===0,(Math.floor(y/2)+Math.floor(xx/3))%2===0,(xx*y)%2+(xx*y)%3===0,((xx*y)%2+(xx*y)%3)%2===0,((xx+y)%2+(xx*y)%3)%2===0][mask];
            g[y][xx]=!!(b^(mk?1:0));
          }
        }
        up=!up;
      }
      /* format info, ECC L = 01 */
      let d=(1<<3|mask),r=d<<10;for(let i=14;i>=10;i--)if((r>>i)&1)r^=0x537<<(i-10);
      const f=((d<<10)|r)^0x5412,bit=i=>((f>>i)&1)===1;
      for(let i=0;i<=5;i++)g[i][8]=bit(i);g[7][8]=bit(6);g[8][8]=bit(7);g[8][7]=bit(8);for(let i=9;i<15;i++)g[8][14-i]=bit(i);
      for(let i=0;i<8;i++)g[8][size-1-i]=bit(i);for(let i=8;i<15;i++)g[size-15+i][8]=bit(i);
      g[size-8][8]=true;
      return g;
    };
    const pen=g=>{
      let p=0;
      for(let a=0;a<2;a++)for(let i=0;i<size;i++){let run=1;for(let j=1;j<size;j++){const c=a?g[j][i]:g[i][j],q=a?g[j-1][i]:g[i][j-1];if(c===q){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=g[y][x];if(c===g[y][x+1]&&c===g[y+1][x]&&c===g[y+1][x+1])p+=3}
      return p;
    };
    let best=null,bp=1e9;for(let k=0;k<8;k++){const g=place(k),p=pen(g);if(p<bp){bp=p;best=g}}
    return best;
  }
  function svg(text,{size=200,fg='#0A0A0A',bg='#FFFFFF',pad=2}={}){
    const g=build(text);if(!g)return '';
    const n=g.length+pad*2;let d='';
    g.forEach((row,y)=>row.forEach((c,x)=>{if(c)d+=`M${x+pad} ${y+pad}h1v1h-1z`}));
    return `<svg viewBox="0 0 ${n} ${n}" width="${size}" height="${size}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${n}" height="${n}" fill="${bg}"/><path d="${d}" fill="${fg}"/></svg>`;
  }
  return {build,svg};
})();

/* ---------- swap turns with anyone ---------- */
const SW={c:null,mine:null,other:null,sweet:0};
const SWEET=[[0,'None'],[.1,'10%'],[.25,'25%']];
const futureMine=c=>c.order.map((x,k)=>x==='me'?k:-1).filter(k=>k>c.round);
function swapTargets(c){return c.order.map((id,k)=>({m:memOf(c,id),k})).filter(x=>x.k>c.round&&x.m&&!x.m.you&&x.m.status==='active')}
const handTag=(c,k)=>{const id=c.order[k];if(c.order.filter(x=>x===id).length<2)return '';return ` · hand ${c.order.slice(0,k+1).filter(x=>x===id).length}`};
function swapSheet(){
  const c=SW.c,mine=futureMine(c),sw=Math.round(c.amount*SW.sweet),tg=swapTargets(c);
  return `<h3>Swap turns</h3><p class="sub">Ask anyone in ${esc(c.name)}. They have to agree.</p>
  ${mine.length>1?`<div class="sec" style="margin:10px 0 8px">Your turn</div><div class="pills" id="swm" style="margin:0 0 6px;padding:0;flex-wrap:wrap">${mine.map(k=>`<button class="pill ${SW.mine===k?'on':''}" data-act="swmine" data-k="${k}">${fdate(dueAt(c,k))}</button>`).join('')}</div>`:`<div class="card flat hrow" style="margin:6px 0 10px;gap:12px"><div class="grow"><div class="meta">Your turn</div><div class="name">${fdate(dueAt(c,mine[0]))}</div></div></div>`}
  <div class="sec" style="margin:10px 0 8px">Swap with</div><div class="stack gap8" id="swl">${tg.map(x=>`<button class="opt ${SW.other===x.k?'on':''}" data-act="swpick" data-k="${x.k}">${av(x.m,36)}<div><div class="name">${esc(x.m.name)}${handTag(c,x.k)}</div><div class="meta">${fdate(dueAt(c,x.k))} · ${x.k<SW.mine?'earlier than yours':'later than yours'}</div></div><i class="rd"></i></button>`).join('')}</div>
  <div class="sec" style="margin:16px 0 8px">Add a sweetener</div><div class="pills" id="swp" style="margin:0;padding:0">${SWEET.map(s=>`<button class="pill ${SW.sweet===s[0]?'on':''}" data-act="swsw" data-k="${s[0]}">${s[1]}</button>`).join('')}</div><div class="meta" id="swn" style="margin:8px 2px 16px">${sw?`${money(sw)} goes to them if they say yes.`:'A small thank-you makes a yes more likely.'}</div>
  <button class="btn pri ${SW.other!=null?'':'off'}" id="swgo" data-act="swgo">Send request</button>`;
}
A.swap=t=>{
  const el=topEl(),id=(t&&t.dataset&&t.dataset.id)||(el&&el.__v&&el.__v.params&&el.__v.params.id),c=getC(id)||curC();
  if(!c||c.status!=='active')return;
  if(c.swapReq){toast('A swap request is already waiting','clock');return}
  const mine=futureMine(c);
  if(!mine.length){toast('You have no turn left to swap','info');return}
  if(!swapTargets(c).length){toast('Nobody to swap with right now','info');return}
  SW.c=c;SW.mine=mine[0];SW.sweet=0;SW.other=null;
  if(t&&t.dataset&&t.dataset.k!=null&&t.dataset.k!=='')SW.other=+t.dataset.k;
  if(t&&t.dataset&&t.dataset.m){const x=swapTargets(c).find(y=>y.m.id===t.dataset.m);if(x)SW.other=x.k}
  sheet(swapSheet());
};
A.swmine=t=>{SW.mine=+t.dataset.k;setSheet(swapSheet())};
A.swpick=t=>{SW.other=+t.dataset.k;$$('#swl .opt').forEach(o=>o.classList.toggle('on',+o.dataset.k===SW.other));$('#swgo').classList.remove('off')};
A.swsw=t=>{SW.sweet=+t.dataset.k;$$('#swp .pill').forEach(b=>b.classList.toggle('on',+b.dataset.k===SW.sweet));const sw=Math.round(SW.c.amount*SW.sweet);$('#swn').textContent=sw?`${money(sw)} goes to them if they say yes.`:'A small thank-you makes a yes more likely.'};
A.swgo=()=>{
  const c=SW.c,id=c.order[SW.other],m=memOf(c,id),sw=Math.round(c.amount*SW.sweet);if(!m)return;
  if(sw>S.bal){needFunds(sw);return}
  const yes=(m.trust>=75&&Math.random()<.55)||(sw>0&&Math.random()<.8)||Math.random()<.3;
  c.swapReq={mineK:SW.mine,otherK:SW.other,with:id,sweet:sw,at:now(),res:Date.now()+rnd(5000,9000),yes};
  clog(c,`You asked ${m.name} to swap turns`);save();closeSheet();refresh();toast(`Request sent to ${m.name}`,'swap');
};
function resolveSwap(c){
  const q=c.swapReq,m=memOf(c,q.with);c.swapReq=null;if(!m)return;
  const ok=c.order[q.mineK]==='me'&&c.order[q.otherK]===q.with&&q.mineK>c.round&&q.otherK>c.round;
  if(q.yes&&ok){
    [c.order[q.mineK],c.order[q.otherK]]=[c.order[q.otherK],c.order[q.mineK]];
    if(q.sweet){S.bal-=q.sweet;addTx({kind:'fee',amount:-q.sweet,title:'Turn swap thank-you',sub:`${m.name} · ${c.name}`,circle:c.id})}
    clog(c,`You swapped turns with ${m.name}`);
    notify({title:`${m.name} said yes`,body:`You now collect ${fdate(dueAt(c,q.otherK))}.`,kind:'info',circle:c.id,icon:'swap'});
  }else{
    clog(c,`${m.name} kept their turn`);
    notify({title:`${m.name} would rather keep their turn`,body:'Nothing changed. Try someone else or add a sweetener.',kind:'info',circle:c.id,icon:'swap'});
  }
}
function makeIncoming(c){
  const mine=futureMine(c);if(!mine.length||c.swapIn||c.swapReq)return false;
  const t=swapTargets(c);if(!t.length)return false;
  const o=pick(t),mk=pick(mine),sweet=Math.random()<.5?Math.round(c.amount*pick([.1,.25])):0;
  c.swapIn={from:o.m.id,fromK:o.k,mineK:mk,sweet,at:now()};
  notify({title:`${o.m.name} wants to swap turns`,body:`${fdate(dueAt(c,mk))} for ${fdate(dueAt(c,o.k))}${sweet?` · ${money(sweet)} thank-you`:''}`,kind:'info',circle:c.id,icon:'swap'});
  return true;
}
function swapInCard(c){
  const q=c.swapIn;if(!q)return '';const m=memOf(c,q.from);
  if(!m||c.order[q.fromK]!==q.from||c.order[q.mineK]!=='me'||q.mineK<=c.round||q.fromK<=c.round)return '';
  return `<div class="card" style="margin-top:12px"><div class="hrow" style="gap:12px;align-items:flex-start">${av(m,40)}<div class="grow"><div class="name">${esc(m.name)} asks to swap turns</div><div class="meta" style="white-space:normal;margin-top:2px">You would collect ${fdate(dueAt(c,q.fromK))} instead of ${fdate(dueAt(c,q.mineK))}.${q.sweet?` They add ${money(q.sweet)}.`:''}</div></div></div><div class="hrow" style="gap:10px;margin-top:12px"><button class="btn sec grow" data-act="swdecline" data-id="${c.id}">Decline</button><button class="btn pri grow" data-act="swaccept" data-id="${c.id}">Accept</button></div></div>`;
}
A.swaccept=t=>{
  const c=getC(t.dataset.id),q=c&&c.swapIn;if(!q)return;
  if(c.order[q.fromK]!==q.from||c.order[q.mineK]!=='me'){c.swapIn=null;save();refresh();return}
  [c.order[q.mineK],c.order[q.fromK]]=[c.order[q.fromK],c.order[q.mineK]];
  const m=memOf(c,q.from);
  if(q.sweet){S.bal+=q.sweet;addTx({kind:'refund',amount:q.sweet,title:'Turn swap thank-you',sub:`${m.name} · ${c.name}`,circle:c.id})}
  c.swapIn=null;clog(c,`You swapped turns with ${m.name}`);save();refresh();toast(`Swapped with ${m.name}`,'swap');confetti({count:40,y:innerHeight*.5});
};
A.swdecline=t=>{const c=getC(t.dataset.id);if(!c||!c.swapIn)return;const m=memOf(c,c.swapIn.from);c.swapIn=null;clog(c,`You kept your turn`);save();refresh();toast(`Kept your turn${m?' · '+m.name+' was told':''}`,'check')};

/* ---------- agreement ---------- */
function agreementClauses(c){
  const f=FREQ[c.freq].toLowerCase();
  return [
    ['Contributions',`Every member pays ${money(c.amount)} ${f}, on or before the due date. The pot is ${money(pot(c))} each round.`],
    ['Turns',`One member collects the whole pot each round, in the agreed order. The order is locked once the circle starts. Members can swap turns only if both agree.`],
    ['Late payments',`There is a ${c.grace}-day grace period after a due date. After that, a ${c.fee?c.fee+'% late fee applies and goes into the pot':'late payment is still tracked'}.`],
    ['Missed payments',c.deposit?`If a payment is still missing after the grace period, that member’s safety deposit (${money(c.amount)}) covers the pot, and their trust score drops.`:`There is no safety deposit in this circle, so a missed payment is raised as a report.`],
    ['Leaving',`Before you collect, you can leave once a replacement joins and your contributions are refunded. After you collect, you settle what you still owe before you leave.`],
    ['Problems',`Any member can report a problem. The affected amount is held while the other members vote and Rondo reviews. Rondo makes the final call if the vote is tied.`],
    ['Your money',`All contributions sit in escrow and move only on payout day. Nobody, including the organiser, can withdraw them early.`]
  ];
}

/* ---------- dispute votes ---------- */
function voters(c){const d=c.dispute;return c.members.filter(m=>m.status==='active'&&m.id!==d.by&&m.id!==d.against&&!(d.by==='me'&&m.you))}
function tally(d){const v=Object.values(d.votes||{});return {up:v.filter(x=>x==='up').length,down:v.filter(x=>x==='down').length}}
function voteBlock(c){

const _orig=new WeakMap();
function langApply(root=document.getElementById('app')){
  if(!root)return;const d=DICT[S.lang||'en'];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){
    const raw=n.nodeValue,tr=raw.trim();if(!tr)continue;

  }
}

/* ---------- cash flow on Home ---------- */
function cashEvents(days){
  const end=now()+days*DAY,out=[];
  for(const c of S.circles){
    if(c.status!=='active')continue;
    for(let r=c.round;r<c.size;r++){
      const d=dueAt(c,r);if(d>end)break;
      const p=c.pay[r]&&c.pay[r].me;
      if(!(p&&p.s==='paid'))out.push({t:Math.max(d,now()),amt:-(owes(c)-((p&&p.part)||0)),c,kind:'pay'});
    }
    const slots=(c.order||[]).map((id,i)=>id==='me'?i:-1).filter(i=>i>=c.round);
    for(const i of slots){const d=dueAt(c,i);if(d<=end&&!c.payouts.some(p=>p.id==='me'&&p.round===i))out.push({t:d,amt:c.amount*c.size,c,kind:'get'})}
  }
  return out.sort((a,b)=>a.t-b.t);
}
function cashflow(){
  const ev=cashEvents(30);if(!ev.length)return '';
  const out=-ev.filter(e=>e.amt<0).reduce((a,e)=>a+e.amt,0),inn=ev.filter(e=>e.amt>0).reduce((a,e)=>a+e.amt,0);
  const w=Math.max(out,inn)||1;
  return `<div class="sech"><div class="sec">Next 30 days</div></div><div class="card"><div class="cfl"><div class="kv"><span class="k">You pay</span><span class="v ${S.hide?'blur':''}">${money(out)}</span></div><div class="cfbar"><i style="width:${out/w*100}%"></i></div><div class="kv" style="margin-top:10px"><span class="k">You collect</span><span class="v ${S.hide?'blur':''}">${money(inn)}</span></div><div class="cfbar y"><i style="width:${inn/w*100}%"></i></div></div><div class="hr"></div>${ev.slice(0,3).map(e=>`<button class="row" style="padding:10px 0" data-act="open" data-id="${e.c.id}"><div class="grow"><div class="name">${e.kind==='pay'?'Pay':'Collect'} · ${esc(e.c.name)}</div><div class="meta">${fdate(e.t)}</div></div><div class="num ${S.hide?'blur':''}">${e.amt>0?'+':'−'}${money(Math.abs(e.amt))}</div></button>`).join('')}</div>`;
}

  <div class="meta stulab">Extra</div><div class="stuscroll" id="stac"><button class="stile ${!l.acc?'on':''}" data-act="stuac" data-k="" aria-label="None"><span class="meta">None</span></button>${ACC_ALL.map(a=>tile('stuac',a,{shape:'dot',color:l.color,mood:'happy',acc:a},l.acc===a,40)).join('')}</div>
  <button class="btn pri" style="margin-top:16px" data-act="studone">Done</button>`);
};
function stuRefreshTiles(){
  const l=S.user.look;
  $$('#stsp .stile').forEach(b=>b.innerHTML=face({shape:b.dataset.k,color:l.color,mood:'happy'},44));
  $$('#stmo .stile').forEach(b=>b.innerHTML=face({shape:l.shape,color:l.color,mood:b.dataset.k},44));
  $$('#stac .stile[data-k]:not([data-k=""])').forEach(b=>b.innerHTML=face({shape:'dot',color:l.color,mood:'happy',acc:b.dataset.k},40));
}
A.stusp=t=>{const l=S.user.look;l.shape=t.dataset.k;stuOn('#stsp .stile',k=>k===l.shape);stuRefreshTiles();stuPrev();buzz(10);save()};
A.stuco=t=>{const l=S.user.look;l.color=t.dataset.k;stuOn('#stco button',k=>k===l.color);stuRefreshTiles();stuPrev();buzz(10);save()};
A.stumo=t=>{const l=S.user.look;l.mood=t.dataset.k;stuOn('#stmo .stile',k=>k===l.mood);stuPrev();buzz(10);save()};
A.stuac=t=>{const l=S.user.look;l.acc=t.dataset.k;stuOn('#stac .stile',k=>k===(l.acc||''));stuPrev();buzz(10);save()};
A.stushuf=()=>{const l=S.user.look;l.shape=pick(SHAPES);l.color=pick(COLORS);l.mood=pick(MOODS.slice(0,13));l.acc=Math.random()<.5?pick(ACCS):'';save();closeSheet(true);setTimeout(()=>{A.studio();buzz(14)},30)};
A.studone=()=>{closeSheet();refresh()};

/* ---------- boot ---------- */
A.verifyui=()=>{AFTER=null;A.verify()};
A.bankui=()=>{AFTER=null;A.bank()};
function iconPNG(sz,mask){
  const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');
  g.fillStyle='#0A0A0A';g.fillRect(0,0,sz,sz);const k=sz/64,r=(mask?13:16)*k;
  g.lineWidth=(mask?5.6:7)*k;g.lineCap='round';g.strokeStyle='#fff';g.beginPath();
  const a0=-8.5*Math.PI/180;g.arc(32*k,32*k,r,a0,a0+80/100.5*2*Math.PI);g.stroke();
  const an=-45*Math.PI/180;g.fillStyle='#FFD60A';g.beginPath();g.arc(32*k+r*Math.cos(an),32*k+r*Math.sin(an),(mask?5.2:6.4)*k,0,7);g.fill();
  return c.toDataURL('image/png');
}
function pwa(){
  try{
    const i192=iconPNG(192),i512=iconPNG(512),m512=iconPNG(512,true);
    const man={name:'Rondo',short_name:'Rondo',description:'Save together. Take turns collecting.',start_url:'./',scope:'./',display:'standalone',orientation:'portrait',background_color:'#0A0A0A',theme_color:'#0A0A0A',icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'},{src:m512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    $('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    $('#ati').href=iconPNG(180);
  }catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function wireInputs(){
  const app=$('#app');
  app.addEventListener('input',e=>{
    const t=e.target,id=t.id;
    if(id==='cc'&&t.tagName==='INPUT'&&D){D.amount=parseInt(t.value.replace(/\D/g,''))||0;D.custom=true;amtSync()}
    else if(id==='jc'){t.value=t.value.toUpperCase();jcheck(t.value)}
    else if(id==='cn'){D.name=t.value}
    else if(id==='cd'){if(t.value.length>=6){_ac++;t.blur();setTimeout(()=>AUTH.step==='code'&&goAuth('profile',1),300)}}
    else if(id==='bi'){BD.draft=t.value}
    else if(id==='fa'){FUND.amt=parseInt(t.value.replace(/\D/g,''))||0;fundSync()}
  });
  app.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='rf'){RPT.file=t.files[0]?t.files[0].name:null;$('#rfn').textContent=RPT.file||'Attach a screenshot'}
    if(t.id==='ef'){$('#efn').textContent=t.files[0]?t.files[0].name:'Choose a file'}
  });
}
function boot(){
  applyTheme();bindApp();wireInputs();pwa();a11yBoot();
  matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
  const needLock=S.onboarded&&S.lockOn&&Date.now()-(S.lastSeen||0)>5*MIN;
  if(!S.onboarded)resetTo('onboard',{},'');else resetTo('home',{},'');
  const sp=$('#splash');
  setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),800);
    if(needLock)askPin(`Welcome back, ${first(S.user.name)}`,'Enter your PIN',()=>{},'check',false);
  },2300);
  langWatch();setTimeout(()=>langApply(),50);
  const hj=(location.hash||'').match(/j=([A-Za-z0-9-]+)/);
  if(hj&&S.onboarded)setTimeout(()=>{A.join();setTimeout(()=>{const i=$('#jc');if(i){i.value=hj[1].toUpperCase();jcheck(i.value)}},500)},2800);
  setTimeout(tick,1500);setInterval(()=>{S.lastSeen=Date.now();tick()},2000);
  const seen=()=>{S.lastSeen=Date.now();save()};
  addEventListener('pagehide',seen);document.addEventListener('visibilitychange',()=>{if(document.hidden)seen();else tick()});
}
boot();
